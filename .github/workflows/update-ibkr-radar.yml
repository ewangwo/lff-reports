name: Update IBKR public radar

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * 1-5"
    - cron: "17 8 * * 0,6"

permissions:
  contents: write

concurrency:
  group: update-ibkr-public-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test collector and refresh public snapshot
        run: |
          python -m pip install pytest
          python -m pytest -q
          python scripts/update_ibkr_radar.py --output data/ibkr-radar/public-snapshot.json

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: radar-app/pnpm-lock.yaml

      - name: Test and build dashboard
        working-directory: radar-app
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build

      - name: Publish refreshed public snapshot
        run: |
          if git diff --quiet -- data/ibkr-radar tools/ibkr-radar; then
            echo "No public snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ibkr-radar tools/ibkr-radar
          git commit -m "chore: refresh IBKR public radar [skip ci]"
          git push
