<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--gold:#d29922;--pink:#f778ba;--orange:#f0883e;--font:-apple-system,BlinkMacSystemFont,'SF Pro','Segoe UI',sans-serif;--mono:'JetBrains Mono','SF Mono','Cascadia Code',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.7}
.hero{padding:60px 24px 40px;text-align:center;background:linear-gradient(180deg,#0d1117 0%,#161b22 100%);border-bottom:1px solid var(--border)}
.hero h1{font-size:2.4em;font-weight:800;background:linear-gradient(135deg,#58a6ff,#f778ba);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:var(--dim);margin-top:12px;font-size:1.05em;max-width:640px;margin-inline:auto}
.hero .badge{display:inline-block;margin-top:16px;background:#21262d;border:1px solid var(--border);border-radius:6px;padding:6px 14px;font-size:0.85em;color:var(--dim)}
.phase-bar{display:flex;overflow-x:auto;gap:6px;padding:14px 20px;background:#0d1117;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;scrollbar-width:thin}
.phase-btn{flex-shrink:0;padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:0.75em;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:var(--mono)}
.phase-btn:hover{border-color:var(--accent);color:var(--accent)}
.day-grid{display:flex;flex-wrap:wrap;gap:5px;padding:10px 20px;border-bottom:1px solid var(--border)}
.day-dot{width:32px;height:32px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:0.7em;font-family:var(--mono);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .12s}
.day-dot:hover{border-color:var(--accent);color:var(--accent)}
.day-dot.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.container{max-width:820px;margin:0 auto;padding:28px 20px 60px}
.day-card{display:none}
.day-card.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.day-header{margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.day-header h2{font-size:1.5em;font-weight:700;margin:6px 0 2px}
.day-header .sub{color:var(--dim);font-size:0.85em}
.tag{display:inline-block;font-size:0.72em;font-family:var(--mono);padding:2px 10px;border-radius:4px;margin-bottom:6px}
.tag-p1{background:#0d4429;color:var(--green)}
.tag-p2{background:#1f3a5f;color:var(--accent)}
.tag-p3{background:#3d1f3d;color:var(--pink)}
.tag-p4{background:#3d2e1f;color:var(--gold)}
.tag-p5{background:#3d1f1f;color:var(--orange)}
.tag-p6{background:#1f2a3d;color:#79c0ff}
.tag-p7{background:#1f3d2a;color:#56d364}
.block{margin-bottom:22px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.block-title{font-size:0.82em;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--accent);text-transform:uppercase;letter-spacing:0.3px}
.block-title .ico{font-size:1em}
.block p{color:#c9d1d9;font-size:0.93em;line-height:1.75}
.block ul{list-style:none;padding:0;margin:6px 0}
.block ul li{padding:4px 0 4px 18px;position:relative;color:#c9d1d9;font-size:0.93em;line-height:1.65}
.block ul li::before{content:'›';position:absolute;left:0;color:var(--accent);font-weight:700}
.code-case{background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:14px 18px;margin:6px 0;font-family:var(--mono);font-size:0.82em;line-height:1.55;overflow-x:auto;color:#c9d1d9;white-space:pre-wrap}
.quiz-box{border-left:3px solid var(--gold);background:linear-gradient(135deg,#1a1f2e 0%,#161b22 100%);border-radius:8px;padding:16px 20px;margin:4px 0}
.quiz-box .q{color:var(--gold);font-size:0.82em;font-weight:600;margin-bottom:4px}
.quiz-box .qt{color:#c9d1d9;font-size:0.92em;line-height:1.65}
.nav-buttons{display:flex;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px solid var(--border)}
.nav-btn{padding:8px 20px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:0.85em;transition:all .15s;font-family:var(--font)}
.nav-btn:hover{border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:0.3;cursor:not-allowed}
.footer{text-align:center;padding:36px 20px;color:var(--dim);font-size:0.82em;border-top:1px solid var(--border)}
.footer a{color:var(--accent);text-decoration:none}
@media(max-width:600px){
  .hero h1{font-size:1.5em}
  .hero p{font-size:0.92em}
  .phase-bar{padding:10px;gap:4px}
  .phase-btn{font-size:0.65em;padding:4px 8px}
  .day-grid{gap:4px;padding:8px}
  .day-dot{width:26px;height:26px;font-size:0.6em}
  .container{padding:16px 12px 40px}
  .day-header h2{font-size:1.15em}
  .block{padding:14px 14px}
}
</style>

<script>
const DAYS = [{"d": 1, "p": 1, "tag": "经济思维", "title": "稀缺性 · 选择的底层逻辑", "core": "经济学不是关于钱, 而是关于选择。只要资源有限, 就必须排序。你的时间、注意力、本金都是稀缺资源。", "deep": "<p>稀缺性是一切经济思考的起点。当你明白资源永远不够同时满足所有目标时, 投资的本质就浮现了: <b>配置稀缺资本到最有机会的地方</b>。</p><p>稀缺性按层级展开: 个人层面(有限本金和时间)、公司层面(有限研发和营销预算)、市场层面(有限的好机会)。真正成熟的投资者不是说'这个公司好所以买', 而是继续追问: 它比什么更好? 它会挤掉什么投资?</p>", "case": "// 你每天面对的稀缺问题\nconst capital = 10000;\nconst opportunities = [\n  { stock:'NVDA', expectedReturn: 0.15, risk: 0.25 },\n  { stock:'SPY',  expectedReturn: 0.08, risk: 0.15 },\n  { bond:'BND',  expectedReturn: 0.04, risk: 0.05 }\n];\n// 你必须排序——不可能全买", "quiz": "写下你今天最稀缺的3种资源: 时间、注意力、现金、信息、情绪稳定性。你今天的安排是否把最稀缺的资源用在最重要的事情上?"}, {"d": 2, "p": 1, "tag": "经济思维", "title": "机会成本 · 你没选的那个选项", "core": "做一件事的真正成本, 不是你花了什么, 而是你放弃了什么——你放弃的那个次优选择的价值。", "deep": "<p>机会成本是投资中最容易被忽略的概念。你买了NVDA没买GOOG, NVDA涨了20%但GOOG涨了30%——你的真实收益不是20%, 而是-10%(相对于次优选择)。</p><p>同样的逻辑: 持有现金也有机会成本——那些你错过的涨幅。但持有现金也有机会收益——那些你没踩到的坑。关键不是永远选对, 而是理解每个选择放弃了什么。</p>", "case": "// 机会成本 = 次优选择的价值\nfunction opportunityCost(chosen, nextBest) {\n  return nextBest.return - chosen.return;\n}\n// 如果你选了收益率8%的债券而非12%的指数\n// 机会成本 = 12% - 8% = 4%\n// 不是'赚了8%', 而是'放弃了4%'", "quiz": "选一只你正在考虑的股票, 写下: 买它的机会成本是什么? 如果不买, 那笔钱最好的替代用途是什么?"}, {"d": 3, "p": 1, "tag": "经济思维", "title": "边际分析 · 再多一点值不值", "core": "所有'值不值得'的问题, 本质上都是: 再投入一单位资源, 边际收益是否大于边际成本?", "deep": "<p>多数投资决策不是'买vs不买', 而是'买多少'。边际效用递减: 第一股最有满足感, 第一百股就没那么刺激了。</p><p>理性决策应该在边际收益约等于边际成本的点停下来。你研究一只股票, 头2小时读年报得到核心判断。再2小时看分析师报告是补充细节。再2小时刷论坛是噪音。第2小时后边际收益急剧下降。</p><p>加仓也是一样: 每多加一股, 潜在收益不变, 但集中度风险上升。在某一点, 边际风险超过边际收益——那就是你的仓位上限。</p>", "case": "# 边际分析模型\ndef marginal_analysis(position, next_shares):\n    current_risk = position['weight'] * position['volatility']\n    new_weight = (position['value'] + next_shares * position['price']) / portfolio_value\n    marginal_risk = new_weight * position['volatility'] - current_risk\n    marginal_return = position['expected_return'] * (next_shares * position['price']) / position['value']\n    return marginal_return / marginal_risk  # 边际夏普率", "quiz": "选一个你关注并想做研究的股票。头30分钟专注做核心判断(是否值得持有), 然后停。不要掉进信息过载的陷阱。"}, {"d": 4, "p": 1, "tag": "经济思维", "title": "激励 · 人按奖励结构行动", "core": "人不是按'应该做什么'行动, 而是按'奖励结构指向什么'行动。要理解市场行为, 先理解参与者的激励。", "deep": "<p>激励是解码市场行为的万能钥匙。</p><p>CEO的激励是股价和期权——他们追求季度业绩和回购股票。销售团队的激励是佣金——他们推高利润的产品。分析师的激励是吸引投行业务——他们的研报天然偏多。做空者的激励是发现造假——他们是市场的清道夫。</p><p>当你看到一条新闻说'某公司宣布大规模回购', 别只看到消息——看到CEO们的股权激励在驱动这个决定。每个市场行为背后, 都有人按自己的激励行事。</p>", "case": "// 解码市场激励\nconst players = [\n  { role:'CEO',    incentive:'stock options back to short-term price' },\n  { role:'analyst',incentive:'deal flow to bullish ratings' },\n  { role:'short',  incentive:'finding fraud to uncovering truth' },\n  { role:'retail', incentive:'FOMO to buying at peak' }\n];", "quiz": "看一条今日市场新闻, 列出涉及的所有角色(公司、分析师、媒体、监管), 写下每个角色的激励是什么。"}, {"d": 5, "p": 1, "tag": "经济思维", "title": "价格机制 · 市场在说什么", "core": "价格不是数字, 而是信息浓缩器——它把成千上万人的分散知识、偏好和预期压缩成一个信号。", "deep": "<p>价格的神奇之处: 没有人知道全部信息, 但每个人都通过交易把自己知道的那部分投入了价格。股票价格是所有已知信息(财报、趋势、政策、情绪)在每一秒的加权共识。</p><p>当价格大幅变化时, 市场不是'疯了'——而是信息集变了。先问'什么信息变了', 比问'市场怎么了'更有价值。</p><p>这对你意味着: 如果你没有新信息, 就不要因为价格波动而交易。价格波动本身不是交易理由。只有当你认为价格所反映的信息集是错的(你掌握了市场没定价的信息), 才应该出手。</p>", "case": "# 价格 = 信息的加权共识\n# 如果你没有新信息, 不要交易\nif not has_new_information:\n    do_not_trade()\n\n# 只有当 price 偏离了你对 intrinsic_value 的估计\n# 且你有信息优势时, 才出手\nif price < intrinsic_value * 0.8 and information_advantage:\n    buy(position_sizing(confidence))", "quiz": "选一个持仓股票, 看过去一周的价格变化。不问涨跌幅, 问: 什么新信息被定价了?"}, {"d": 6, "p": 1, "tag": "经济思维", "title": "供需 · 市场变化的底层引擎", "core": "一切价格变化的原因只有两个: 供给变了, 或者需求变了。同时分析两者才能看清全局。", "deep": "<p>这是你作为程序员最容易理解的框架——一个最基本的系统。</p><p>存储周期: 2022-2023年需求(PC/手机出货下降)+供给(产能过剩)=价格暴跌80%。2024年起需求(AI拉动HBM)+供给(转向HBM减少传统DRAM)=价格回升。</p><p>AI芯片: NVDA需求爆炸(大模型军备竞赛)+供给受限(CoWoS产能瓶颈)=价格飙升+等待时间延长。</p><p>供需分析时最怕只看到一边。只看到需求增长就冲进去买, 忽略了供给也在快速扩产, 这是最常见的投资错误。</p>", "case": "class Market:\n    def __init__(self):\n        self.demand_curve = []\n        self.supply_curve = []\n    def equilibrium(self):\n        while self.demand > self.supply:\n            self.price += 1  # 供不应求涨价\n        while self.supply > self.demand:\n            self.price -= 1  # 供过于求跌价\n        return self.price  # 永远在动态调整", "quiz": "选一个你关注的行业(存储、AI芯片、电动车), 画出当前供给和需求的天平, 判断均衡向哪移动。"}, {"d": 7, "p": 1, "tag": "经济思维", "title": "市场效率 · 你能战胜市场吗", "core": "有效市场假说认为股价已经反映了所有公开信息。但你不需要'战胜市场', 你需要的是'找到适合你的市场参与方式'。", "deep": "<p>市场效率有三种层次: 弱有效(历史价格已反映, 技术分析无效)、半强有效(所有公开信息已反映)、强有效(内幕信息也反映了)。</p><p>现实: 市场大多数时候是半强有效的。这意味着如果你只是读新闻、看财报, 你的信息已经被定价了。</p><p>但市场并非永远有效——恐慌和泡沫时效率最低。这时候纪律(而非智商)的回报最高。对于刚起步的你, 与其试图战胜市场, 不如先学会<b>加入市场</b>——宽基指数是你最好的起点。</p>", "case": "def market_efficiency(information):\n    if information == 'public news':\n        return 'already priced in'\n    elif information == 'historical prices':\n        return 'already priced in'\n    elif information == 'insider info':\n        return 'illegal'\n    else:\n        return 'long-term structural insight'\n    # 只有结构性洞察才有机会", "quiz": "回想一次你因为看到好消息买入、结果股价跌了的经历。分析: 这个好消息是什么时候被市场知道的?"}, {"d": 8, "p": 1, "tag": "经济思维", "title": "信息不对称 · 你的优势在哪", "core": "当交易双方知道的信息不一样时, 市场就会扭曲。找到你的信息优势, 就是找到你的投资机会。", "deep": "<p>阿克洛夫'柠檬市场'理论: 卖旧车的人知道车况, 买的人不知道——买家只愿意出平均价——好车不愿卖, 市场只剩烂车。</p><p>在股市里, 机构投资者比散户信息更全、分析更深。这不是一个公平的游戏——除非你找到你的信息优势。</p><p>你的程序员背景就是优势: 你比大多数投资者更懂技术产品、更理解科技公司的商业模式、能判断技术路线的可行性。当你看到一个新AI框架或芯片架构时, 你对它价值判断比基金经理更准。</p><p>不要和机构比信息速度, 要和你自己的优势比深度。</p>", "case": "class InformationAdvantage:\n    def __init__(self, background):\n        self.domain = {\n            'software engineer': ['SaaS', 'dev tools', 'AI/ML'],\n            'hardware engineer': ['semiconductors', 'HW'],\n            'generalist': ['consumer', 'enterprise']\n        }.get(background, ['general'])\n    def investable(self, company):\n        return company.sector in self.domain", "quiz": "列出你作为程序员的3个信息优势领域(SaaS定价、AI模型评估、云计算架构等)。哪些上市公司在这个领域?"}, {"d": 9, "p": 1, "tag": "经济思维", "title": "风险与回报 · 唯一的免费午餐", "core": "高回报必然伴随高风险——但通过分散化, 你可以在不降低预期回报的情况下降低风险。这是金融学唯一的免费午餐。", "deep": "<p>风险和回报的关系是金融学的第一原理。没有免费的午餐——如果有人承诺高回报低风险, 他要么在骗你, 要么自己也没搞懂。</p><p>'免费午餐'是分散化。单一股票的年波动率约30-50%, 而一个充分分散的指数(SPY)波动率约15%。通过持有30-50只不同行业的股票, 你可以把非系统性风险降到几乎为零, 只保留市场整体的系统性风险。</p><p>这就是为什么第一笔投资应该是指数基金——你用一个交易获得了30-50只股票的分散效果。先学会不亏钱, 再学怎么赚钱。</p>", "case": "import numpy as np\n# 分散化降低风险\n# 1只: ~40% -> 10只: ~20% -> 50只: ~15%\nn_stocks = range(1, 51)\nportfolio_vol = [np.sqrt(1/n + (1-1/n)*0.3) * 0.4 for n in n_stocks]\n# 结论: 15-20只股票后边际收益急剧下降", "quiz": "如果你现在有$10,000, 构造一个最简单的3-5只ETF/股票组合。不追求最优, 追求'如果明天市场跌10%, 我不会睡不着'。"}, {"d": 10, "p": 1, "tag": "经济思维", "title": "时间价值 · 复利是你最好的朋友", "core": "今天的一块钱比明天的一块钱更值钱——因为它可以投资增值。这个简单概念是整个金融体系的基石。", "deep": "<p>时间价值(TVM)是金融学的第一块积木。$100今天投资, 按8%年化, 30年后价值$1,006。没有魔法, 只是时间+复利。</p><p>72法则: 用72除以年化收益率, 得到本金翻倍需要的年数。8% x 9年 = 72 -> 9年翻倍。12% -> 6年翻倍。6% -> 12年。</p><p>这对你意味着什么: 开始早一年, 结果天差地别。25岁开始每月存$500 vs 35岁开始, 到65岁相差近2倍(假设8%回报)。时间是你最强大的杠杆——不花一分钱就能让你的钱工作更久。</p>", "case": "def future_value(pv, rate, years):\n    return pv * (1 + rate) ** years\n\n# 24岁 vs 34岁开始每月定投$500\n# 到65岁(8%年化):\n# 24岁 -> $1,726,000\n# 34岁 -> $791,000\n# 晚了10年, 少了54%", "quiz": "计算一下: 如果你现在每月定投$X到SPY, 按8%年化, 10年后、20年后、30年后分别是多少?"}, {"d": 11, "p": 2, "tag": "市场工具", "title": "股票 · 你买的到底是什么", "core": "股票不是屏幕上的代码, 而是公司的一部分所有权。买一股NVDA, 你就是NVDA的股东。", "deep": "<p>普通股(Common Stock)代表公司的部分所有权。公司发行股票来融资, 你买股票来获得公司未来利润的一部分。</p><p>关键概念:</p><ul><li>市值(Market Cap)= 股价 x 总股本</li><li>流通股(Float)= 可在市场交易的股数</li><li>股息率 = 每股分红 / 股价</li><li>市盈率(P/E)= 股价 / 每股盈利</li></ul><p>记住: 你自己是公司的股东, 和贝佐斯、马斯克没有本质区别——只是持股比例不同。每次买入前, 问自己: '我愿意拥有这家公司的一部分吗?'</p>", "case": "// 股票 = ownership token\nconst share = {\n  company: 'NVIDIA Corporation',\n  ownership: 0.00000001,  // 你的一股\n  claimsTo: [\n    '未来利润的一部分',\n    '投票权',\n    '公司清算时的剩余价值'\n  ]\n};", "quiz": "打开你关注的一只股票, 看它的市值、P/E、股息率。用一句话回答: 这家公司是做什么的赚钱的?"}, {"d": 12, "p": 2, "tag": "市场工具", "title": "债券 · 另一半市场", "core": "股票是你拥有公司的一部分, 债券是你借给公司/政府的钱。债券更'无聊', 但它是投资组合的稳定器。", "deep": "<p>债券的核心要素: 面值(Face Value, 到期拿回的本金)、票面利率(Coupon Rate, 每年利息)、到期日(Maturity)、收益率(Yield, 基于买入价的回报率)。</p><p>关键关系: <b>债券价格和利率反向变动</b>。利率上升->你持有的旧债券不划算了->价格下跌。利率下降->你的旧债券更值钱了->价格上涨。</p><p>债券给你的组合提供两样东西: 稳定现金流(利息)和风险缓冲(股市跌时债券通常涨)。对刚起步者: 从短期国债(SGOV、BIL)或综合债券ETF(BND、AGG)开始。</p>", "case": "class Bond:\n    def __init__(self, fv, coupon, maturity):\n        self.fv = fv\n        self.coupon = coupon\n        self.maturity = maturity\n    def price(self, market_rate):\n        pv = sum([self.fv * self.coupon / (1+market_rate)**t\n                  for t in range(1, self.maturity+1)])\n        pv += self.fv / (1+market_rate)**self.maturity\n        return pv", "quiz": "查一下SGOV或BND的当前收益率。如果美联储降息1%, 这只债券ETF的价格会涨还是跌?"}, {"d": 13, "p": 2, "tag": "市场工具", "title": "ETF · 懒人致富法", "core": "ETF是一种可以像股票一样交易的基金, 持有一篮子资产。对95%的个人投资者来说, ETF是最好的投资工具。", "deep": "<p>ETF(交易型开放式指数基金)结合了股票的交易便利和基金的分散化:</p><ul><li>买一股SPY = 持有S&P 500里500家公司各一小份</li><li>管理费极低(SPY仅0.09%)</li><li>随时可以买卖(像股票一样)</li><li>分散化自动完成</li></ul><p>为什么90%的主动管理基金经理长期跑不赢S&P 500? 不是因为笨, 是因为市场太有效了。如果你已经接受了有效市场的结论, 那ETF就是最理性的选择。</p><p>不要小看'简单买指数'——它能打败大多数专业人士。先让指数帮你积累, 再用闲钱去探索个股。</p>", "case": "# 买指数 = 默认你跑不赢市场\n# 而90%的专业人士也跑不赢\n# 所以这很合理\ndef lazy_portfolio(age, risk_tolerance):\n    if risk_tolerance == 'high' and age < 40:\n        return {'VTI': 70, 'VXUS': 20, 'BND': 10}\n    elif risk_tolerance == 'medium':\n        return {'VTI': 55, 'VXUS': 15, 'BND': 30}\n    else:\n        return {'VTI': 30, 'VXUS': 10, 'BND': 60}", "quiz": "搜索'VT vs SPY vs VTI', 了解这三个最流行的美股ETF的区别。选一个作为你的'核心持仓'。"}, {"d": 14, "p": 2, "tag": "市场工具", "title": "美股市场结构 · 代码跑在哪", "core": "美股通过交易所(NYSE、NASDAQ)和电子通信网络(ECN)交易。理解市场结构, 你就知道你的订单去了哪里。", "deep": "<p>美股有两个主要交易所: NYSE(纽交所, 有物理交易大厅)和NASDAQ(纯电子化, 科技股聚集)。</p><p>此外还有大量暗池(Dark Pool)和ECN, 机构在这里进行大额交易以避免影响市场价格。</p><p>订单类型很重要:</p><ul><li>Market Order: 立即按最优价成交——保证成交, 不保证价格</li><li>Limit Order: 指定价格成交——保证价格, 不保证成交</li><li>Stop Order: 触发后变市价单——用于止损</li></ul><p>做程序员的理解优势: 市场结构就是一个分布式订单匹配系统。理解它的机制, 能帮你做出更好的交易决策。</p>", "case": "# 订单薄(Order Book)就像一个队列\nclass OrderBook:\n    def __init__(self):\n        self.bids = []  # 买单, 价格从高到低\n        self.asks = []  # 卖单, 价格从低到高\n    def market_buy(self, shares):\n        fill_price = self.asks[0].price\n        return fill_price  # 大单会推高价格", "quiz": "在你的券商APP里找到订单类型选项。理解Market和Limit订单的区别。什么场景用Market? 什么场景用Limit?"}, {"d": 15, "p": 2, "tag": "市场工具", "title": "股指 · 它们衡量什么", "core": "S&P 500、纳斯达克、道琼斯——这些指数不是'市场', 而是市场的不同快照。理解它们的构成, 你就知道新闻里说的'市场涨了'到底涨的是什么。", "deep": "<p>主要美股指数:</p><ul><li>S&P 500 (SPX): 500家大公司, 市值加权, 最代表'美股大盘'</li><li>纳斯达克综合(COMP): 所有纳斯达克上市的股票——科技股权重高</li><li>纳斯达克100 (NDX): 最大的100家非金融公司——真正的科技风向标</li><li>道琼斯(DJI): 30只蓝筹股, 价格加权——历史最老但最不具代表性</li><li>罗素2000 (RUT): 小盘股指——代表国内经济活跃度</li></ul><p>注意: S&P 500不是'500家公司的平均', 是市值加权。苹果一个人的涨跌比400家小公司的总和影响还大。</p>", "case": "# S&P 500的'集中度'\n# 前5大公司(AAPL, NVDA, MSFT, GOOG, AMZN)\n# 占整个指数约25%\n# 指数表现很大程度取决于这5家\n\ndef index_concentration(top_n, weights):\n    return sum(sorted(weights, reverse=True)[:top_n])", "quiz": "查一下S&P 500前10大成分股权重。今天的S&P 500涨跌, 主要被谁决定了?"}, {"d": 16, "p": 2, "tag": "市场工具", "title": "期权入门 · 风险管理工具", "core": "期权不是赌博工具——它是保险。买期权就像买保险: 支付保费来保护自己不受极端损失。", "deep": "<p>期权两种基本类型:</p><ul><li>Call(看涨期权): 你有权在到期前以特定价格买入股票</li><li>Put(看跌期权): 你有权在到期前以特定价格卖出股票</li></ul><p>核心参数: 行权价(Strike)、到期日(Expiration)、权利金(Premium)。</p><p>对初学者: 期权的正确用法不是投机, 而是对冲。比如你持有NVDA 100股担心下跌, 可以买入Put作为保险。</p><p><b>强烈建议: </b>先不要交易期权。先用6-12个月理解股票, 再用模拟盘学习期权。期权的杠杆属性可以在一天内让你亏损全部本金。</p>", "case": "# 期权 = 保险\nclass PutOption:\n    def __init__(self, stock_price, strike, premium):\n        self.strike = strike       # 行权价(保额)\n        self.premium = premium     # 权利金(保费)\n    def payoff(self, price_at_expiry):\n        return max(self.strike - price_at_expiry, 0) - self.premium", "quiz": "在你的券商APP里找到期权链, 不交易, 只看。看NVDA的Put期权在不同行权价的权利金是多少。"}, {"d": 17, "p": 2, "tag": "市场工具", "title": "股息与回购 · 公司还钱的两种方式", "core": "公司赚钱了, 要么再投资, 要么还给股东——还股东有两种方式: 分红(现金)和回购(减少总股本)。", "deep": "<p><b>分红(Dividend):</b> 每股派发现金, 稳定的分红是公司财务健康的信号。股息率 = 年分红/股价。</p><p><b>回购(Buyback):</b> 公司在公开市场买自己的股票然后注销。总股本减少->你的持股比例提升。比分红更省税。</p><p>作为初学者: 不要只盯着高分红股票。一家快速成长的公司不分红是因为它认为钱能产生更高回报。苹果2012年开始分红时, 已经被认为进入了'成熟期'。成长vs分红是公司生命周期的选择, 不是好坏之分。</p>", "case": "class ShareholderReturn:\n    def buyback_impact(self, shares, price, buyback_amount):\n        new_shares = shares - buyback_amount / price\n        eps_increase = shares / new_shares\n        return f'EPS increase by {eps_increase:.1%}'\n    # 回购=BUT减总股本=你的持股比例上升", "quiz": "选一只你关注的股票, 查它过去5年的分红历史和回购记录。它是成长型(不分红/少回购)还是价值型(稳定分红)?"}, {"d": 18, "p": 2, "tag": "市场工具", "title": "构建你的第一笔组合", "core": "前8天的知识整合成一个可执行的组合。你不需要完美, 你需要开始。", "deep": "<p><b>第一步: 先建立核心仓位(80%的资金)</b></p><ul><li>50% VTI(全美股市场)或SPY(S&P 500)</li><li>20% VXUS(国际股票)</li><li>10% BND(美国债券)或SGOV(短期国债)</li></ul><p><b>第二步: 用卫星仓位探索(20%的资金)</b></p><ul><li>用这笔小钱买你研究过的个股</li><li>每次交易问自己: '我有信息优势吗?'</li><li>每次买入前先写买入理由</li></ul><p><b>第三步: 定投纪律</b></p><ul><li>每月固定日期投入固定金额(DCA)</li><li>不择时——时间是定投的朋友</li><li>市场跌了: 同样的钱买到更多份额</li><li>市场涨了: 你的持仓升值了</li></ul>", "case": "def first_portfolio(monthly_income):\n    invest = monthly_income * 0.3\n    core = {\n        'VTI': invest * 0.5,\n        'VXUS': invest * 0.2,\n        'BND': invest * 0.1\n    }\n    satellite = invest * 0.2\n    return {'core': core, 'satellite': satellite}\n    # 简单、分散、可执行", "quiz": "假设你月收入中可拿出$1,000投资。按上面方案算: VTI/VXUS/BND各配多少? 剩下的$200你会研究哪只股票?"}, {"d": 19, "p": 3, "tag": "公司分析", "title": "利润表 · 公司赚不赚钱", "core": "利润表回答一个简单问题: 这家公司在特定时期内创造了多少利润? 收入-费用=利润。", "deep": "<p>利润表的结构(从上到下):</p><ul><li>收入(Revenue): 卖产品/服务收到的钱</li><li>营业成本(COGS): 生产产品的直接成本</li><li>毛利润(Gross Profit)= 收入-营业成本</li><li>营业费用(OpEx): 研发、销售、管理成本</li><li>营业利润(Operating Income)= 毛利润-营业费用</li><li>净利润(Net Income)= 减去利息、税后的最终利润</li></ul><p>关键指标: 毛利率=毛利润/收入(定价权和成本控制), 营业利润率=营业利润/收入(核心业务盈利能力)。</p>", "case": "# 利润表 = 一段顺序执行的代码\nincome_statement = {\n    'revenue': 100_000,\n    'cogs': -40_000,\n    'gross_profit': 60_000,      # 60%\n    'r_and_d': -15_000,\n    'sales_marketing': -10_000,\n    'operating_income': 35_000,   # 35%\n    'interest_tax': -8_000,\n    'net_income': 27_000          # 27%\n}", "quiz": "在SEC EDGAR或你的券商APP里找到Apple(AAPL)最新的财报。看它的毛利率和净利率。"}, {"d": 20, "p": 3, "tag": "公司分析", "title": "资产负债表 · 公司有什么欠什么", "core": "资产负债表是一张快照: 在某一时刻, 公司有什么(资产)、欠什么(负债)、股东剩什么(权益)。资产=负债+权益。", "deep": "<p>资产负债表的核心等式: <b>资产 = 负债 + 股东权益</b></p><p><b>资产(Assets):</b> 公司拥有的资源——现金、应收账款、存货、固定资产(厂房设备)、无形资产(专利商誉)</p><p><b>负债(Liabilities):</b> 公司欠的钱——应付账款、短期债务、长期债务(债券贷款)</p><p><b>股东权益(Equity):</b> 资产减负债后的剩余——实收资本+留存收益</p><p>程序员视角: 资产负债表像Git仓库状态——资产是working directory, 负债是欠的technical debt, 权益是你的net worth。财务健康的公司, 负债率不能太高。</p>", "case": "# 资产负债表 = 公司的状态快照\nbalance_sheet = {\n    'assets': {'cash': 50000, 'receivables': 20000,\n               'inventory': 15000, 'property': 100000},\n    'liabilities': {'short_term_debt': 15000,\n                    'long_term_debt': 50000},\n    'equity': 120000\n}\n# 负债率 = 65000/185000 = 35% (合理)", "quiz": "看AAPL的资产负债表。它的现金和短期投资是多少? 长期债务是多少? 苹果是'净现金'公司还是'净负债'公司?"}, {"d": 21, "p": 3, "tag": "公司分析", "title": "现金流量表 · 真金白银", "core": "利润是会计概念, 现金才是真实的。公司可以说谎调整利润, 但很难伪造现金。现金流量表揭示真相。", "deep": "<p>现金流量表分三部分:</p><ul><li><b>经营活动现金流(OCF):</b> 公司主营业务产生的现金——最重要的数字</li><li><b>投资活动现金流(ICF):</b> 买/卖固定资产、收购等——负数通常是好事(在投资未来)</li><li><b>融资活动现金流(FCF):</b> 借钱、还钱、增发、回购、分红</li></ul><p><b>最重要的指标: 自由现金流(FCF)= 经营现金流-资本开支</b></p><p>自由现金流是公司真正可以自由支配的钱——用来分红、回购、还债、收购。长期来看, 股价和价值自由现金流的能力正相关。</p>", "case": "# 利润 vs 现金: 会计利润可以操纵, 现金不能\ndef cash_is_king(net_income, depreciation, capex, wc_change):\n    ocf = net_income + depreciation - wc_change\n    fcf = ocf - capex\n    if fcf > net_income: return '现金比利润多, 健康'\n    elif fcf < net_income * 0.5: return '利润质量不高'\n    return '正常'", "quiz": "找AAPL最新年报的自由现金流。和它的净利润比一下——自由现金流是高于还是低于净利润?"}, {"d": 22, "p": 3, "tag": "公司分析", "title": "财务比率 · 一眼看穿公司", "core": "财务比率让你在5秒内对一个公司形成初步判断。它们是把海量财报数据压缩成可比较的信号。", "deep": "<p><b>估值比率:</b> P/E(市盈率, 市场愿为每$1利润付多少钱), P/B(市净率), P/S(市销率), EV/EBITDA</p><p><b>盈利能力比率:</b> ROE(净利润/股东权益, 股东每投入$1赚多少), ROIC(税后营业利润/投入资本)</p><p><b>财务健康比率:</b> D/E(负债权益比, 杠杆水平), 流动比率(流动资产/流动负债, 短期偿债能力)</p><p>程序员视角: 这些比率就是你的监控指标——每个比率都在告诉你系统的某个方面是否健康。</p>", "case": "class FinancialMonitor:\n    def check_valuation(self, pe, industry_pe):\n        if pe > industry_pe * 2:\n            return 'P/E显著高于行业, 预期很高'\n        if pe < industry_pe * 0.5:\n            return 'P/E显著低于行业, 可能是价值陷阱'\n        return '估值合理'\n    def check_health(self, debt_equity):\n        if debt_equity > 2: return '高杠杆'\n        if debt_equity < 0.3: return '财务保守'\n        return '健康'", "quiz": "选一只你关注的股票, 查它的P/E和ROE。和行业内竞争对手对比一下。"}, {"d": 23, "p": 3, "tag": "公司分析", "title": "护城河 · 什么保护公司不被抢生意", "core": "护城河是公司长期抵御竞争对手的能力。没有护城河的公司, 利润终将被竞争侵蚀。", "deep": "<p>五种常见护城河:</p><ol><li><b>品牌护城河</b>(Apple/Nike): 消费者愿意为品牌溢价付费</li><li><b>规模护城河</b>(Walmart/AMZN): 规模效应让成本更低</li><li><b>转换成本</b>(Microsoft/Salesforce): 客户换供应商太麻烦</li><li><b>网络效应</b>(Meta/Visa): 用户越多越有价值</li><li><b>专利/监管</b>(制药公司): 法律保护阻止竞争</li></ol><p>作为程序员, 你天然能理解转换成本和网络效应的威力——你用AWS是因为迁移太麻烦, 你用微信是因为所有人都在上面。</p><p>每次研究一家公司, 先问: <b>它的护城河是什么?</b> 如果30秒内答不上来, 这家公司可能没有真正的竞争优势。</p>", "case": "def moat_rating(company):\n    moats = []\n    if company.brand_premium > 0.2: moats.append('brand')\n    if company.switching_cost == 'high': moats.append('sticky')\n    if company.network_effect: moats.append('network')\n    rating = len(moats)\n    if rating >= 3: return 'Wide Moat'\n    if rating == 2: return 'Narrow Moat'\n    return 'No Moat (trade carefully)'", "quiz": "选一个你日常使用的产品(VS Code、GitHub、AWS)。它所在的公司的护城河是什么?"}, {"d": 24, "p": 3, "tag": "公司分析", "title": "行业分析 · 选对赛道", "core": "好公司在烂行业也很难赚钱, 平庸公司在好行业也能赚钱。行业结构决定了利润最终流向谁。", "deep": "<p>波特的五力分析框架:</p><ol><li><b>现有竞争者的对抗</b>——竞争激烈利润被价格战吃掉(航空)</li><li><b>新进入者的威胁</b>——门槛低很快被颠覆(共享单车)</li><li><b>替代品的威胁</b>——客户有替代方案, 定价权就弱</li><li><b>供应商的议价能力</b>——唯一供应商吃掉你的利润(ASML对芯片厂)</li><li><b>买家的议价能力</b>——大客户压低价格(Walmart对供应商)</li></ol><p>以半导体为例: ASML(光刻机)在五力里几乎无敌——唯一供应商+极高门槛+客户别无选择->超强定价权->70%+毛利率。PC组装厂则相反——竞争激烈+门槛低+客户价格敏感->个位数利润率。</p>", "case": "class IndustryAnalysis:\n    def __init__(self):\n        self.forces = {'rivalry':3,'new_entrants':3,\n                       'substitutes':3,'supplier_power':3,'buyer_power':3}\n    def attractiveness(self):\n        score = 25 - sum(self.forces.values())\n        return 'High' if score>=15 else 'Medium' if score>=10 else 'Low'", "quiz": "选择两个行业(比如航空 vs 半导体), 用波特五力快速评估。为什么一个利润率高一个低?"}, {"d": 25, "p": 3, "tag": "公司分析", "title": "10-K与10-Q · 从SEC找真相", "core": "年报(10-K)是上市公司最真实、最全面的信息披露。读10-K比读100篇分析师研报更有价值。", "deep": "<p>SEC要求所有上市公司每年提交10-K(年报)、每季度提交10-Q(季报)。</p><p><b>10-K核心章节(按阅读优先级):</b></p><ol><li><b>业务描述(Item 1):</b> 公司怎么赚钱——最重要的一节</li><li><b>风险因素(Item 1A):</b> 管理层列出的最大风险——诚实得令人惊讶</li><li><b>管理层讨论(Item 7, MD&A):</b> 管理层对业绩的解释</li><li><b>财务报表(Item 8):</b> 三张表+附注</li></ol><p>作为程序员, 你的阅读理解能力远超普通投资者。找一家你关注的公司, 从10-K的Item 1开始读——你会惊讶于管理层直白地告诉了你他们在做什么、担心什么。</p>", "case": "# SEC EDGAR 查询\ndef get_10k(ticker):\n    # 1. 去 sec.gov/cgi-bin/browse-edgar\n    # 2. 输入 ticker\n    # 3. 查找 '10-K' 文件\n    # 4. 打开 'Interactive Data'\n    print('Item 1 -> How they make money')\n    print('Item 1A -> What keeps them up at night')", "quiz": "去 sec.gov 搜索AAPL的10-K。只读Item 1(业务描述)和Item 1A(风险因素)——不超过30分钟。"}, {"d": 26, "p": 3, "tag": "公司分析", "title": "估值基础 · 它值多少钱", "core": "估值的核心不是计算一个精确数字, 而是建立一个'值多少'的区间。当市场价格明显高于这个区间时别买, 明显低于时别怕。", "deep": "<p>三种主要估值方法:</p><p><b>1. DCF(现金流折现):</b> 预测未来所有自由现金流折现到今天。理论上最严谨, 但极度依赖假设, 改变1%增长率结论差20%。</p><p><b>2. 可比公司分析(Comps):</b> 用同行业公司的估值倍数估算。反映市场当前态度, 但如果整个行业都高估, 你会买在高位。</p><p><b>3. 历史估值区间:</b> 看公司历史上在什么P/E区间交易。简单但要注意'这次不一样'的风险。</p><p>估值不是算一个'正确答案', 而是给你一个判断框架——当价格远低于你的估值时, 你的信心从哪里来。</p>", "case": "def dcf_valuation(fcf, growth_rate, discount_rate, years):\n    value = 0\n    for year in range(1, years+1):\n        fcf *= (1 + growth_rate)\n        value += fcf / (1+discount_rate)**year\n    terminal = fcf*(1+0.03)/(discount_rate-0.03)\n    value += terminal/(1+discount_rate)**years\n    return value\n# 不同增长假设 -> 估值差30%+\n# 结论不是'它值$180', 是'它值$150-210'", "quiz": "选一只你熟悉的股票, 不看它当前股价, 快速估算它的P/E是15、25还是40? 为什么?"}, {"d": 27, "p": 3, "tag": "公司分析", "title": "价值vs成长 · 两种投资哲学", "core": "价值投资买'现在便宜', 成长投资买'未来伟大'。两种方法都能赚钱, 关键是理解你适合哪种。", "deep": "<p><b>价值投资:</b> 以低于内在价值的价格买入。喜欢低P/E、低P/B、高股息。代表: 格雷厄姆、巴菲特。经典案例: 可口可乐(1988), Apple(2016)。</p><p><b>成长投资:</b> 买入未来能高速增长的公司。喜欢高收入增长率、大市场空间、强大护城河。代表: 费雪、Peter Lynch。经典案例: 早期Amazon、NVDA。</p><p><b>大多数成功的投资者是两者的混合:</b> 在合理的价格买入好公司(GARP, Growth at a Reasonable Price)。极端价值可能踩价值陷阱, 极端成长可能追高泡沫。</p>", "case": "def investment_style(company):\n    if company.pe < 15 and company.growth < 10:\n        return 'Deep Value'\n    elif company.pe < 25 and company.growth > 15:\n        return 'GARP'  # 合理价格成长\n    elif company.pe > 30 and company.growth > 20:\n        return 'Growth'\n    else: return 'Blend'", "quiz": "看你的自选股列表, 把每只股票分为价值/成长/混合。你的偏好偏向哪边? 和你的性格匹配吗?"}, {"d": 28, "p": 3, "tag": "公司分析", "title": "整合 · 从零到投资的流程", "core": "把前10天学到的所有工具整合成一个完整的分析流程——从发现公司到做出投资决策。", "deep": "<p><b>Step 1: 快速筛选(5分钟)</b><br>这公司做什么的? 毛利率>30%? P/E vs 行业均值?</p><p><b>Step 2: 行业分析(15分钟)</b><br>波特五力, 护城河, 增长驱动力</p><p><b>Step 3: 深入研究(30分钟)</b><br>读10-K Item 1, 利润表趋势, 资产负债表健康度, 自由现金流趋势</p><p><b>Step 4: 估值(15分钟)</b><br>当前P/E位置, 简单DCF, 同行比较</p><p><b>Step 5: 决策(5分钟)</b><br>我有信息优势吗? 如果跌30%会加仓还是恐慌? 仓位多大不会影响睡眠?</p>", "case": "class StockAnalysis:\n    def screen(self): pass\n    def industry(self): pass\n    def deep_dive(self): pass\n    def valuation(self): pass\n    def decide(self):\n        return 'Need more edge'\n\n# 选一只你感兴趣但还没买的股票\n# 完整走一遍这5个步骤", "quiz": "选一只你感兴趣但还没买的股票, 完整走一遍这5个步骤。记录你的分析过程。"}, {"d": 29, "p": 4, "tag": "投资框架", "title": "现代投资组合理论 · 数学告诉你分散化", "core": "不要把鸡蛋放在一个篮子里——这不仅是老话, 而是数学结论。通过持有不相关的资产, 你可以降低风险而不牺牲回报。", "deep": "<p>马科维茨的核心洞察: 组合的期望回报是各资产的加权平均, 但组合的风险(波动率)不是各资产风险的加权平均——因为资产价格不会同步波动。</p><p>关键概念: <b>相关性(Correlation)</b>。相关性=1: 完美同步, 分散化无意义。相关性=0: 不相关, 分散化效果明显。相关性=-1: 完美反向避险(现实中几乎没有)。</p><p>股票和债券的相关性通常为负(股市跌时资金逃向债券)。这就是为什么经典组合是60%股票+40%债券。你只需要3-4个低相关的资产类别就能获得90%的分散化效果。</p>", "case": "import numpy as np\n# 组合波动率公式\ndef portfolio_vol(w1, s1, w2, s2, rho):\n    return np.sqrt(w1**2*s1**2 + w2**2*s2**2 + 2*w1*w2*rho*s1*s2)\n# 股票(s=18%) + 债券(s=6%), rho=-0.3\n# 60/40组合波动率 = 10.7%\n# 低于两者的加权平均 -> 免费午餐", "quiz": "查VT(全市场股票)和BND(全市场债券)过去5年的相关性。60/40组合的最大回撤是多少?"}, {"d": 30, "p": 4, "tag": "投资框架", "title": "资产配置 · 最重要的决策", "core": "研究显示: 一个投资组合超过90%的回报波动来自资产配置决策(股票vs债券比例), 而不是选股或择时。", "deep": "<p>资产配置决定了你投资体验的90%。</p><ul><li>保守(30%股票+70%债券): 波动小, 增长有限</li><li>平衡(50%+50%): 经典60/40的变体</li><li>成长(70%+30%): 长期回报好, 波动可承受</li><li>激进(90%+10%): 波动大, 适合年轻人</li></ul><p>两个额外维度: 地理分散(美国vs国际)和因子暴露(价值、小盘等)。</p><p>你的配置比例应该在市场大涨时(你想追高)和市场大跌时(你想割肉)都能坚持。如果你在2020年3月因恐慌把股票减到0, 你配置错了。</p>", "case": "def asset_allocation(age, risk_tolerance):\n    base_stock = 100 - age\n    if risk_tolerance == 'high': base_stock += 10\n    elif risk_tolerance == 'low': base_stock -= 10\n    bond = 100 - base_stock\n    return {'stocks': base_stock, 'bonds': bond}\n# 30岁, 中等风险 -> 股票70%, 债券30%", "quiz": "根据公式算你的股债配置比例。你晚上能睡着吗? 睡不着就下调股票比例。"}, {"d": 31, "p": 4, "tag": "投资框架", "title": "风险管理 · 活得久比赚得快重要", "core": "投资的第一条法则: 不要亏钱。第二条法则: 记住第一条。风险管理不是限制收益, 而是确保你能长期留在游戏里。", "deep": "<p><b>1. 仓位管理</b><br>单只股票不超过总仓位的5-10%, 单个行业不超过20-25%。哪怕再看好, 也不要ALL IN。</p><p><b>2. 止损纪律</b><br>买入前要问: 如果跌了30%, 我会加仓还是割肉? 提前想清楚, 不要在恐慌中做决定。</p><p><b>3. 现金缓冲</b><br>永远保留一部分现金。现金是期权——让你在市场恐慌时有子弹。5-10%现金是'平静剂'。</p><p><b>4. 压力测试</b><br>如果明天大盘跌20%, 我的组合会怎样? 如果失业6个月, 我需要卖股票吗?</p>", "case": "class RiskManager:\n    def __init__(self, portfolio_value):\n        self.total = portfolio_value\n        self.max_position = self.total * 0.08\n    def check(self, ticker, buy_amount, current_weight):\n        new_weight = (current_weight + buy_amount) / self.total\n        if new_weight > 0.10: return '超过单仓上限'\n        return '可以买入'", "quiz": "假设你持有$10万组合。如果明天NVDA跌30%、SPY跌15%、BND涨5%, 组合总价值变成多少? 能接受吗?"}, {"d": 32, "p": 4, "tag": "投资框架", "title": "DCA vs 一次投入 · 什么时候买", "core": "定期定额(DCA)和一次性投入(Lump Sum)各有优劣。DCA降低择时风险, 一次性投入长期回报更高。", "deep": "<p><b>一次性投入(Lump Sum):</b> 有$12万现在全部买入。大约2/3的时间跑赢DCA。但心理冲击大——万一买在顶部。</p><p><b>定期定额(DCA):</b> 分12个月每月投$1万。避免了买在最高点的风险, 但损失了等待期间的上涨收益。心理上更容易接受。</p><p><b>实际建议:</b></p><ul><li>已有储蓄: 可以考虑一次性投入(先想好配置比例)</li><li>每月工资结余: DCA天然适合——每月固定日期投固定金额</li><li>关键不是择时, 是<b>坚持</b></li></ul>", "case": "# DCA vs Lump Sum 模拟\ndef simulate(initial=120000, monthly=10000, years=10, r=0.08):\n    lump = initial * (1+r)**years\n    dca = 0\n    for m in range(years*12):\n        dca += monthly\n        dca *= (1+r/12)\n    return {'lump': round(lump), 'dca': round(dca)}", "quiz": "如果你现在有$12万想入市, 你会一次性投入还是分12个月DCA? 写下你的理由。"}, {"d": 33, "p": 4, "tag": "投资框架", "title": "价值投资 · 格雷厄姆与巴菲特", "core": "价值投资的核心理念极其简单: 买股票就是买公司。用$0.5买价值$1的东西。然后持有。", "deep": "<p><b>1. 市场是你的仆人, 不是你的向导(Mr. Market)</b><br>市场先生每天给你报价——有时疯狂高, 有时疯狂低。他是来服务你的, 不是来指导你的。</p><p><b>2. 安全边际</b><br>永远以低于你估算内在价值的价格买入。这个价差就是你的安全边际——给你的判断错误留出缓冲。</p><p><b>3. 能力圈</b><br>只投资你能理解的公司。不是所有机会都属于你——只在你能力圈内出击。</p><p><b>4. 长期持有</b><br>'如果你不想持有10年, 就不要持有10分钟。'</p><p>这些原则听起来简单, 做起来极难——因为市场先生狂热时, 你很难不被影响。价值投资不是技术问题, 是心理问题。</p>", "case": "class ValueInvestor:\n    def __init__(self):\n        self.circle_of_competence = []\n        self.margin_of_safety = 0.3\n    def check(self, company, market_price):\n        if company.business not in self.circle_of_competence:\n            return 'PASS - 不在能力圈内'\n        intrinsic = self.estimate_value(company)\n        if market_price < intrinsic * (1 - self.margin_of_safety):\n            return 'BUY'\n        return 'WAIT'", "quiz": "用价值投资的框架看一只你之前想买的股票: 它的安全边际是多少? 你能持有10年吗?"}, {"d": 34, "p": 4, "tag": "投资框架", "title": "成长投资 · 找到10倍股", "core": "成长投资寻找能以持续高于平均水平的速度增长的公司。风险是增长一旦放缓, 高估值会崩塌。", "deep": "<p><b>好成长股的特征:</b></p><ul><li>巨大的可寻址市场(TAM): 公司还有几十倍空间</li><li>持续的增长: 收入年增长20%+</li><li>护城河在加宽: 增长的同时竞争优势在增强</li><li>优秀的资本配置: 投出去的$1能产生>$1的价值</li></ul><p><b>风险:</b> 高估值意味着对未来的极高期待——一旦miss, 股价可能跌50%+。'好公司'和'好股票'是两回事。</p><p><b>对程序员的优势:</b> 你天然理解科技产品的价值和竞争格局。当你使用一个产品时, 你能判断它是否有网络效应、是否有转换成本——这些判断力价值千金。</p>", "case": "# 成长投资的风险: '好公司, 烂股票'\n# 假设公司盈利$1/股, 年增长30%, P/E=60\n# 3年后盈利 = $2.20\n# 如果增长放缓到15%, P/E降到30倍\n# 股价 = $2.20*30 = $66 (3年仅+10%)\n# 年化仅3.2%, 远低于30%的增长", "quiz": "选一只你喜欢的科技股(NVDA、MSFT等), 假设增长率从30%降至15%, 股价3年后会怎样?"}, {"d": 35, "p": 4, "tag": "投资框架", "title": "股息投资 · 睡后收入", "core": "股息投资追求的不是股价增长, 而是稳定的现金分红。适合风险承受能力较低、需要现金流的投资者。", "deep": "<p>股息投资的逻辑: 你买的不是'未来可能涨的代码', 而是'每年给我发钱的资产'。</p><p><b>关键指标:</b> 股息率(每股分红/股价)、派息率(分红/盈利, <50%安全, >80%可能不可持续)、股息增长历史(连续10年+增派=股息贵族)。</p><p><b>股息陷阱:</b> 股息率超高(>8%)往往是股价暴跌的结果。公司可能借钱维持分红。一次分红削减可以让股价腰斩。</p><p>对年轻人: 股息不是首选策略——你的资金应该追求增长。但理解股息是好的——它帮你理解'回报'不仅仅来自股价上涨。</p>", "case": "# 股息再投资的魔力\ndef dividend_snowball(initial, yield_, growth, years):\n    shares = initial / 100\n    qdiv = 100 * yield_ / 4\n    for y in range(years):\n        for q in range(4):\n            income = shares * qdiv\n            shares += income / (100 * 1.05**y)\n        qdiv *= (1 + growth)\n    return shares * 100 * 1.05**years", "quiz": "看你的自选股, 有没有股息率超过2%的? 查一下它的派息率和股息增长历史。"}, {"d": 36, "p": 4, "tag": "投资框架", "title": "因子投资 · 聪明贝塔", "core": "学术研究发现某些'因子'(特征)长期能产生超额回报。你可以利用因子来优化组合——但不要滥用。", "deep": "<p>主要因子: <b>价值(Value)</b>低P/E跑赢, <b>规模(Size)</b>小盘股跑赢, <b>动量(Momentum)</b>趋势延续, <b>质量(Quality)</b>高ROE跑赢, <b>低波动(Low Vol)</b>低波动跑赢。</p><p>每个因子都有对应的ETF: VTV(价值)、VB(小盘)、MTUM(动量)、QUAL(质量)、USMV(低波)。</p><p><b>警告:</b> 因子在长时间(5-10年)内可能根本不工作。最糟糕的策略是在因子表现最差的时候放弃它。对初学者: 先用总市场指数, 研究清楚了再考虑因子倾斜。</p>", "case": "# 因子组合示例\nclass FactorPortfolio:\n    def __init__(self):\n        self.allocation = {\n            'VTI': 0.50,   # 全市场核心\n            'VTV': 0.15,   # 价值因子\n            'VB':  0.10,   # 小盘因子\n            'QUAL': 0.10,  # 质量因子\n            'VXUS': 0.15,  # 国际\n        }\n        # 投资期限<10年, 因子可能不工作", "quiz": "查一下过去5年VTV(价值)和VUG(成长)的表现对比。再查过去10年的——结果一样吗?"}, {"d": 37, "p": 4, "tag": "投资框架", "title": "技术分析 · 码农要不要学K线", "core": "技术分析试图从历史价格和交易量中预测未来走势。学术共识: 对散户来说价值有限。但你作为程序员应该理解为什么。", "deep": "<p>技术分析的假设: 市场行为包容一切, 价格沿趋势运动, 历史会重演。</p><p><b>学术研究为什么不支持它:</b> 有效市场假说认为过去价格不预测未来。如果某指标真有预测力, 所有人都会用->预测力消失。交易成本会吃掉任何小额优势。</p><p><b>但它有现实价值:</b> 很多人相信它->自我实现(支撑位/阻力位确实存在), 可帮助识别市场情绪(极端看多/看空可能是反转信号)。</p><p><b>对你的建议:</b> 了解基本支撑位、阻力位、均线——不是为了靠它们做决策, 而是为了理解其他人在看什么。你的时间更好的花在研究公司和行业上。</p>", "case": "# 移动平均线交叉策略\n# 短均线上穿长均线 -> 买入信号\n# 但Backtest结果: 交易频繁+收益不高\n# 加上交易成本, 通常是负收益\n\ndef ma_strategy_test():\n    return 'Better to just buy and hold'", "quiz": "在你的券商APP里打开一只股票的日线图, 看看200日均线。股价在均线上方还是下方?"}, {"d": 38, "p": 4, "tag": "投资框架", "title": "构建你的决策清单", "core": "投资最大的敌人是你自己。决策清单是你的防御系统——在冲动、恐惧、贪婪影响你之前, 用清单拦住错误。", "deep": "<p><b>买入前检查清单(每次必过):</b></p><ul><li>我理解这家公司怎么赚钱吗?(一句话解释)</li><li>它的护城河是什么?</li><li>未来5年的增长驱动力是什么?</li><li>当前P/E在历史什么位置?</li><li>我的信息优势是什么?</li><li>如果买了就跌30%, 我会怎么做?</li><li>仓位是否超过5-10%?</li></ul><p><b>持有期检查(每季度):</b></p><ul><li>买入的理由还成立吗?</li><li>护城河变宽了还是窄了?</li><li>我的仓位需要调整吗?</li></ul><p>你的决策清单会随着经验迭代——但永远不要跳过它。</p>", "case": "# 每次交易前强制走完清单\ndef pre_trade_checklist():\n    questions = [\n        can_explain_business(), has_moat(),\n        growth_driver_identified(), valuation_reasonable(),\n        has_information_edge(), can_handle_30_percent_drop(),\n        position_size_safe()\n    ]\n    if all(questions): execute_trade()\n    else: print('清单未通过, 回到研究')", "quiz": "根据上面的模板, 写你自己的买入检查清单(至少5条)。下次想买入时打印出来一条条过。"}, {"d": 39, "p": 5, "tag": "宏观视野", "title": "美联储 · 全球最重要的一群人", "core": "美联储(Federal Reserve)实际上是全球金融系统的核心。它的利率决策影响你每一笔投资。", "deep": "<p>美联储的两个核心使命: <b>最大化就业</b> + <b>稳定物价</b>(2%通胀目标)。</p><p><b>主要工具:</b></p><ul><li><b>联邦基金利率:</b> 降息->借钱便宜->刺激经济; 加息->借钱贵->经济降温</li><li><b>量化宽松(QE):</b> 印钞买债券->增加流动性->推高资产价格</li><li><b>量化紧缩(QT):</b> 卖债券回收货币->减少流动性->压制资产价格</li></ul><p><b>利率周期影响:</b> 降息周期->债市先涨->成长股->价值股。加息周期->先砍高估值成长股->防御性资产。</p><p>你不需要预测Fed的下一步——Fed自己也不知道。你需要理解当前处于什么利率周期, 你的组合对利率的敏感度。</p>", "case": "class FedCycle:\n    def __init__(self, rate, inflation):\n        if inflation > 3:\n            print('紧缩周期')\n            print('利: 现金、短债、银行股')\n            print('弊: 高估值成长股')\n        elif rate < 1:\n            print('宽松周期')\n            print('利: 成长股、科技股')\n            print('弊: 现金购买力缩水')", "quiz": "查一下当前的联邦基金利率。美联储最近的表态是鹰派还是鸽派? 你的组合在当前利率环境下受益还是受损?"}, {"d": 40, "p": 5, "tag": "宏观视野", "title": "利率 · 资产定价的锚", "core": "利率是所有金融资产的基准定价工具。利率变化时, 所有资产的价格都会被重新评估。", "deep": "<p>利率为什么如此重要? 利率约等于资金的'租金'。利率低->钱不存银行->流入股票债券->资产价格上涨。利率高->存银行就有不错收益->资金从风险资产流出。</p><p><b>对不同资产的影响:</b></p><ul><li><b>成长股(科技):</b> 对利率最敏感——大部分价值来自遥远的未来利润, 利率高->折现到今天更不值钱</li><li><b>价值股:</b> 受影响较小, 利润在近期</li><li><b>债券:</b> 价格和利率直接反向</li></ul><p>当前利率环境的关键问题: '更高更久'还是'降息在即'? 你的投资姿势取决于你对这个问题的判断——但没有人知道答案, 所以分散配置。</p>", "case": "# 利率对估值的数学影响\n# DCF模型里, 折现率每增加1%, 估值下降10-15%\ndef rate_impact(growth, discount):\n    tv = 100*(1+growth)/(discount-growth)\n    return tv\n# 增长5%, 折现率8% -> 终值$3,500\n# 增长5%, 折现率9% -> 终值$2,625(-25%)", "quiz": "查一下10年期美债收益率。如果它再涨1%, 你的投资组合里哪些资产最受影响?"}, {"d": 41, "p": 5, "tag": "宏观视野", "title": "通胀 · 投资者的隐形税", "core": "通胀是购买力的缓慢侵蚀。即使你的投资名义上涨了, 如果涨幅低于通胀, 你的实际购买力在下降。", "deep": "<p>通胀是你持仓时每天都在交的隐形税。</p><p><b>不同资产的表现:</b></p><ul><li><b>股票:</b> 历史上是抵御通胀的最佳工具——企业可以把成本转嫁给客户</li><li><b>债券(名义):</b> 固定利息在通胀高时被侵蚀——最受伤</li><li><b>TIPS(抗通胀债券):</b> 本金随通胀调整</li><li><b>现金:</b> 最受伤——购买力持续下降</li></ul><p><b>历史教训:</b> 1970年代高通胀期, 股票名义上涨但实际回报为负。1980年代通胀下降+利率下降->股票和债券的双重大牛市。</p><p>一个简单的策略: 持有股票+TIPS+一些海外资产。</p>", "case": "# 名义回报 vs 实际回报\ndef real_return(nominal, inflation):\n    return (1+nominal)/(1+inflation)-1\n# 你的投资: 名义回报8%, 通胀3%\n# 实际回报 ~ 4.85%\n# 你赚的不是8%, 是4.85%\n# 所得税按8%收 -> 双重打击", "quiz": "查一下当前的CPI同比。你的投资组合的预期回报率减掉通胀后, 实际预期回报是多少?"}, {"d": 42, "p": 5, "tag": "宏观视野", "title": "经济指标 · 看懂经济温度计", "core": "经济指标就像体检报告——每个指标告诉你经济的某一方面是否健康。不需要全看懂, 但要知道关键指标指向什么。", "deep": "<p><b>每月必看指标:</b></p><ul><li><b>非农就业(NFP, 每月第一个周五):</b> 新增工作岗位数。>20万经济强劲, <10万经济走弱。对市场影响最大。</li><li><b>CPI(消费者物价指数):</b> 日常商品和服务的价格变化。高CPI->Fed要加息->市场跌。</li><li><b>GDP(每季度):</b> 经济总产出增长率。>3%繁荣, <1%疲弱, 负增长两季=衰退。</li><li><b>PMI(每月初):</b> 制造业和服务业的景气指数。>50扩张, <50收缩。</li></ul><p>不需要每天盯这些数字。每月花15分钟看一遍, 理解当前经济处什么位置就够了。</p>", "case": "def economic_health_check(indicators):\n    score = 0\n    if indicators.nfp > 150000: score += 1\n    if indicators.cpi < 3: score += 1\n    if indicators.gdp > 2: score += 1\n    if indicators.pmi > 50: score += 1\n    if score >= 4: return '经济健康'\n    if score >= 2: return '经济放缓'\n    return '经济风险'", "quiz": "去一个财经网站看最近的NFP、CPI、PMI数据。这三个数字一致指向繁荣、放缓还是分化?"}, {"d": 43, "p": 5, "tag": "宏观视野", "title": "经济周期 · 我们在哪里", "core": "经济不是直线增长, 而是围绕趋势线上下波动。知道经济在周期中的位置, 帮你配置更适合当前阶段的资产。", "deep": "<p>经济周期的四个阶段:</p><ul><li><b>扩张期:</b> GDP增长快, 就业增加。最佳资产: 股票(周期股、小盘股)</li><li><b>高峰:</b> 增长触顶, 通胀压力上升。最佳资产: 能源、原材料、价值股</li><li><b>衰退:</b> GDP负增长, 裁员, 消费下降。最佳资产: 国债、防御性股票(医疗、消费品)</li><li><b>谷底:</b> 经济触底。最佳资产: 股票(尤其是成长股)——最好的买入时机</li></ul><p>对散户最重要的一条: 不要试图精确预测周期转折。'当前处于什么位置?'比'下个月是涨还是跌?'更容易判断——先做容易的事。</p>", "case": "class EconomicCycle:\n    def phase(self, gdp, unemp, infl, curve):\n        if gdp=='up' and unemp=='low':\n            return 'Expansion - Buy stocks'\n        if gdp=='down' and curve=='inverted':\n            return 'Late Cycle - Be cautious'\n        if gdp=='down' and unemp=='rising':\n            return 'Recession - Hold bonds'\n        if gdp=='bottoming' and unemp=='peaking':\n            return 'Recovery - Buy aggressively'", "quiz": "根据你最近的感受(经济新闻、身边裁员情况、CPI数据), 你认为美国经济目前处于哪个阶段?"}, {"d": 44, "p": 5, "tag": "宏观视野", "title": "全球资本流动 · 钱往哪里去", "core": "全球资金每天在不同国家、不同资产类别之间流动。理解资金流向, 你就多了一个看市场的维度。", "deep": "<p><b>1. 美元强弱:</b> 美元强->资本流入美国->美股受益。美元弱->资本流出美国->新兴市场受益。美元强弱约7年一个周期。</p><p><b>2. Risk On/Risk Off:</b> 风险偏好高(Risk On): 资金从债券流向股票, 从美国流向新兴市场。风险偏好低(Risk Off): 资金逃回美元、美债、黄金。触发Risk Off的通常是战争、金融危机、通胀超预期。</p><p><b>3. 全球主要市场特征:</b> 美国(科技股主导)、欧洲(价值型)、日本(便宜估值+日元套利)、新兴市场(高增长高波动)。</p><p>对你的实际意义: 市场之间会互相影响。美股跌了经常是全球一起跌。但'美国vs世界'的配置是你可以控制的。</p>", "case": "# Risk On/Risk Off 监测\ndef risk_appetite(vix, bond_yields):\n    if vix < 15 and bond_yields > 3:\n        return 'Risk On - 股票可能继续涨'\n    elif vix > 30:\n        return 'Risk Off - 避险模式'\n    else: return 'Neutral'", "quiz": "打开VIX指数(恐慌指数), 它是在15以下(平静)还是30以上(恐慌)? 当前是Risk On还是Risk Off?"}, {"d": 45, "p": 5, "tag": "宏观视野", "title": "地缘政治 · 投资者怎么办", "core": "战争、制裁、贸易冲突——地缘政治事件总让你想卖股票。但历史显示: 对长期投资者, 最好的做法通常是'什么都不做'。", "deep": "<p><b>历史规律:</b> 大多数地缘政治冲击对市场短期影响大(几天到几周), 长期影响小。二战期间美股仍然上涨。海湾战争期间市场在冲突爆发当天就触底反弹。</p><p><b>但对某些行业影响是结构性的:</b> 俄乌战争->能源价格长期走高。中美科技战->国产替代加速。</p><p><b>地缘政治管理的黄金法则:</b></p><ol><li>不要因为新闻标题而交易</li><li>不要押注单一地缘政治结果</li><li>分散化是最佳的地缘政治保险</li><li>最糟糕的决策总是在恐慌中做出的</li></ol>", "case": "geopolitical_checklist = [\n    '这会影响到我持仓公司的基本面吗?',\n    '影响是短期(<6个月)还是长期?',\n    '我的投资期限是否能覆盖这个冲击?',\n    '现在卖出是基于恐惧还是纪律?'\n]\n# 如果3个以上答案是'长期/否/否/恐惧'\n# -> 最好的行动就是不行动", "quiz": "找到一条目前最大的地缘政治新闻。用上面的checklist检查——你需要因为这个新闻调整组合吗?"}, {"d": 46, "p": 5, "tag": "宏观视野", "title": "宏观整合 · 在噪音中找到信号", "core": "宏观经济的最大悖论: 知道得越多越不确定。专业人士的预测准确率接近抛硬币。你需要的是识别关键信号, 忽略噪音。", "deep": "<p><b>宏观分析的真正价值</b>不是预测, 而是: 知道当前在什么环境, 知道不同环境下什么资产表现最好, 知道什么时候应该'不知道'。</p><p><b>宏观检查清单(每季度一次):</b></p><ul><li>利率方向(加息/暂停/降息)</li><li>通胀趋势(上升/稳定/下降)</li><li>就业市场(紧俏/平衡/疲软)</li><li>经济周期位置</li><li>市场情绪(贪婪/中性/恐惧)</li></ul><p>当你发现所有信号都指向同一方向时——那是你的行动时刻。当信号混乱时, 不动就是最好的行动。</p><p>对于刚起步的你: <b>80%的时间花在公司和行业研究上, 20%花在宏观上。</b></p>", "case": "# 宏观的'SOLO'原则\n# S - System(系统): 先定义你相信什么\n# O - Observe(观察): 只看关键指标\n# L - Locate(定位): 确定当前周期位置\n# O - Only if...(除非): 除非有决定性信号, 否则不行动\n\ndef macro_solo(uncertainty):\n    if uncertainty: return 'DO NOTHING'\n    if all_signals_align: return 'ACT'", "quiz": "花10分钟, 不用查资料, 写出你对当前宏观环境的理解(3-5句话)。然后下周再写一次——对比你的观点变了没有。"}, {"d": 47, "p": 6, "tag": "行为与纪律", "title": "认知偏见 · 你脑子里的bug", "core": "你的大脑被设计来生存, 不是来投资的。进化留下的认知偏见让你在市场里反复犯错——了解它们是防御的第一步。", "deep": "<p><b>1. 确认偏见(Confirmation Bias):</b> 你只寻找支持你已有观点的信息。买了NVDA->只看利好->忽略风险。</p><p><b>2. 近期偏见(Recency Bias):</b> 最近发生的事影响你更多。上月涨得好->你以为会一直涨->买在高点。</p><p><b>3. 锚定偏见(Anchoring):</b> 过分依赖第一个信息。看到NVDA $100->后来$500你觉得贵, 但它可能值$800。</p><p><b>4. 可得性启发(Availability Heuristic):</b> 容易想到的事=更重要的事。到处看到经济衰退新闻->你高估衰退概率。</p><p><b>防御方法:</b> 流程>直觉。你的决策清单就是你最好的防御。</p>", "case": "# 确认偏见检测\nclass BiasDetector:\n    def check_confirmation_bias(self, holdings):\n        for h in holdings:\n            bullish = search(f'{h} 利好')\n            bearish = search(f'{h} 风险')\n            if len(bullish) > len(bearish)*3:\n                print(f'你对{h}可能有确认偏见')\n                print('主动找反对意见!')", "quiz": "选一个你目前看好的股票。主动找3个看空的理由。你原来的观点还站得住吗?"}, {"d": 48, "p": 6, "tag": "行为与纪律", "title": "情绪管理 · 恐惧与贪婪", "core": "市场底部最恐惧的时候是买入时机, 市场顶部最贪婪的时候是卖出时机——但你的情绪会完美地做相反的事。", "deep": "<p><b>市场底部(最该买的时候):</b> 恐惧、绝望。新闻: 'AI时代结束了'。你该买(但没人做得到)。</p><p><b>市场上升期(该持有的时候):</b> 谨慎乐观。你该持有。</p><p><b>市场顶部(最该卖的时候):</b> 兴奋、自信、'我是天才'。新闻: '新范式'、'这次不一样'。你身边所有人都在讨论赚了多少。你该卖(但没人想卖)。</p><p><b>情绪管理三板斧:</b></p><ol><li>定投计划: 自动执行不纠结</li><li>交易日记: 每个决策写下来</li><li>远离论坛: 别人恐惧还是贪婪, 你跟着做, 大概率错</li></ol>", "case": "def market_sentiment(vix, headlines):\n    if vix > 30 and 'panic' in headlines:\n        return 'FEAR - 可能是买入机会'\n    if vix < 12 and 'moon' in headlines:\n        return 'GREED - 可能是顶部信号'\n    return 'Neutral'", "quiz": "回想你最后一次冲动交易(或差点冲动的时刻)。当时你的情绪是什么(兴奋/恐惧/FOMO)? 下次出现这个情绪时你会做什么?"}, {"d": 49, "p": 6, "tag": "行为与纪律", "title": "行为金融学 · 为什么聪明人做蠢事", "core": "行为金融学研究的是: 为什么知道所有投资原则的人还会反复犯相同的错误。答案是你的大脑结构决定的——不是笨, 是人性。", "deep": "<p><b>1. 损失厌恶(Loss Aversion):</b> 亏损$100的痛苦约等于盈利$200的快乐。导致你在该止损时持有, 在该加仓时犹豫。</p><p><b>2. 处置效应(Disposition Effect):</b> 过早卖出盈利股票('落袋为安'), 过久持有亏损股票('只要不卖就没亏')。结果: 小赚大亏。</p><p><b>3. 过度自信(Overconfidence):</b> 93%的人认为自己驾驶水平高于中位数——投资者也类似。过度自信导致过度交易, 而过度交易是回报的杀手。</p><p><b>4. 羊群效应(Herding):</b> 从众让你买在高点卖在低点。</p><p><b>解决方案:</b> 不是消除偏见(你做不到), 而是用系统和流程绕过它们。你的检查清单就是为此而生。</p>", "case": "class BehavioralErrors:\n    def disposition_effect(self, portfolio):\n        # 应该卖出的决定基于未来预期, 不是当前盈亏\n        for s in portfolio:\n            if s.pnl>0 and s.outlook=='worsening':\n                # 你不想卖因为'还在涨' -> 处置效应\n                pass", "quiz": "看你的持仓, 哪些股票盈利了你不想卖? 哪些亏损了你也不想卖? 问: 如果我现在没持有, 今天还会买它吗?"}, {"d": 50, "p": 6, "tag": "行为与纪律", "title": "税务 · 非美国投资者的考量", "core": "作为非美国投资者投资美股, 税务是你必须理解的现实。它不仅影响你的实际回报, 还影响你的策略选择。", "deep": "<p><b>1. 股息预扣税:</b> 中国居民税率10%。券商会自动扣缴。</p><p><b>2. 资本利得税:</b> 好消息——非美国居民不需要缴纳美国资本利得税。你的居住国可能征收, 但中国目前暂免个人资本利得税。</p><p><b>3. 遗产税(Estate Tax):</b> 非美国居民持有超过$60,000美国资产, 遗产税高达26-40%。解决方案: 用非美国注册的ETF(如爱尔兰注册的CSPX替代SPY)。</p><p><b>4. 税务优化策略:</b> 优先持有不派息或低股息的公司(成长股), 用爱尔兰注册ETF避遗产税, 长期持有递延资本利得税。</p>", "case": "# 股息税的影响\n# 假设$10万股息率2%的股票\n# 年股息: $2,000\n# 预扣税10%: $200\n# 实际到手: $1,800\n\n# 成长股(NVDA, 股息率0.03%): 几乎无影响\n# 股息股(JPM, 股息率2.5%): 需要算税后回报", "quiz": "看你的自选股, 区分哪些是高股息股(>2%)哪些是低/无股息股。你的持仓是否已经天然避开了不必要的股息税?"}, {"d": 51, "p": 6, "tag": "行为与纪律", "title": "券商选择 · 你的投资工具", "core": "券商是你进入市场的入口。选择错误的话, 高的手续费、差的用户体验、甚至安全问题都会影响你的投资结果。", "deep": "<p><b>非美国投资者可选券商:</b></p><ul><li><b>盈透证券(Interactive Brokers):</b> 最专业、费用最低、支持多市场。有API适合量化交易。</li><li><b>嘉信理财(Charles Schwab):</b> 用户体验好, 无交易佣金。</li><li><b>富途/老虎:</b> 中文界面、社区活跃, 适合华人用户。</li><li><b>第一证券(Firstrade):</b> 无佣金、无账户管理费。</li></ul><p><b>选券商checklist:</b> 支持非美国居民、无账户管理费、交易佣金透明、SIPC保险、是否支持中文、订单类型、API支持。</p><p><b>对程序员的特别建议:</b> 盈透的API和TWS功能强大。如果你以后想做量化策略, 盈透是最佳选择之一。</p>", "case": "# 券商选择决策树\ndef choose_broker(needs):\n    if needs.api_trading: return 'Interactive Brokers'\n    elif needs.chinese_ui: return 'Futu/Tiger'\n    elif needs.low_cost: return 'Firstrade'\n    else: return 'IB or Schwab'", "quiz": "如果你还没开美股账户, 选一个券商并注册。如果已经有了, 评估当前券商是否满足所有需求。"}, {"d": 52, "p": 6, "tag": "行为与纪律", "title": "投资日记 · 从经验中学习", "core": "写投资日记不是记录'买了什么', 而是记录'为什么买、当时的感受、预期是什么'——这是你从经验中学习的唯一方式。", "deep": "<p><b>为什么写日记是必要的?</b> 记忆会骗人——你事后会美化自己的决策。'我就知道会这样'偏见: 涨了->'我早就知道', 跌了->'市场不理性'。</p><p><b>每次交易记录:</b> 日期、股票、价格、买入理由(具体: P/E、增长预期、护城河)、情绪状态(恐惧/兴奋/FOMO/经过清单)、信息优势(我知道什么市场不知道的)。</p><p><b>每周回顾(10分钟):</b> 市场发生了什么, 我做了什么交易, 学到了什么。</p><p><b>每月深度回顾(30分钟):</b> 组合表现vs基准, 哪些决策对错, 错的原因(研究不足?情绪失控?运气?), 流程改进。</p>", "case": "# 投资日记模板\ndef trade_journal(ticker, action, price, reason, emotion):\n    entry = f'''\n[{date.today()}] {action} {ticker} @ ${price}\n理由: {reason}\n情绪: {emotion}\n后续: 核心假设将在什么事件上被验证/证伪?\n6个月后我会怎么评价这个决策?\n'''\n    return entry", "quiz": "今天就写第一笔投资日记。即使你还没有真实交易——写你对自己当前持仓的看法和分析。"}, {"d": 53, "p": 6, "tag": "行为与纪律", "title": "读财报 · 季报怎么看", "core": "每个季度上市公司发布财报。知道怎么看财报, 你就比别人多一个信息优势——大多数人只看了标题就冲进去交易了。", "deep": "<p><b>Step 1: 财报发布前(5分钟)</b><br>市场预期是什么? 你自己的预期是什么? 你关注的3个关键数字是什么?</p><p><b>Step 2: 快速读财报(15分钟)</b><br>收入和EPS vs预期(Beat/Miss)。分业务收入: 哪个增长哪个减速。毛利率变化(上升=定价权, 下降=竞争加剧)。<b>指引:</b> 公司对下季度的预测——比本季数字更重要。</p><p><b>Step 3: 电话会(Earnings Call, 30分钟)</b><br>分析师最尖锐的问题。CEO对'竞争'这个词的重音。管理层对未来的语气(自信vs小心翼翼)。</p><p><b>不要做的事:</b> 财报发布后5分钟内追涨杀跌。先读完、想清楚——你有24小时。</p>", "case": "def earnings_report_check(report):\n    flags = []\n    if report.revenue < report.expected * 0.95:\n        flags.append('Miss收入, 需深挖')\n    if report.gross_margin < report.last_q * 0.95:\n        flags.append('毛利率下降, 竞争压力')\n    if report.guidance < report.expected_guidance * 0.9:\n        flags.append('指引低于预期, 最危险信号')\n    return flags", "quiz": "找最近一家公司(至少你关注的一只股票)的财报摘要。看不只看数字——找CEO的声明, 感受语气。"}, {"d": 54, "p": 6, "tag": "行为与纪律", "title": "什么时候卖 · 最难的决定", "core": "'买'的决定是期望, '卖'的决定是对现实的确认。大多数人研究怎么买的时间远远多于研究怎么卖——这是错误的优先序。", "deep": "<p><b>基本面恶化(该卖):</b> 买入的逻辑被证伪——不是股价跌了, 而是公司变得不一样了。护城河变窄, 管理层犯错, 技术路线被替代。</p><p><b>估值过高(可以考虑卖):</b> 股价远超你估算的内在价值。P/E达到历史极值。市场情绪极度乐观。但估值高不一定必须卖——好公司可能在高估值下继续涨。</p><p><b>更好的机会(调仓):</b> 你发现了风险收益比更好的标的。组合需要再平衡。</p><p><b>绝对不要因为股价跌了或涨了而卖。</b>卖的唯一理由应该是你对公司未来的判断变了。</p>", "case": "def should_sell(stock, original_thesis):\n    for assumption in original_thesis:\n        if not is_still_true(assumption):\n            return True  # 核心假设被证伪\n    if stock.valuation > stock.fair_value * 1.5:\n        return 'Consider selling some'\n    return False\n# 不看盈亏, 看未来", "quiz": "看你当前的自选股或持仓, 对每只用一句话写下当初为什么买/关注。这个理由现在还在吗?"}, {"d": 55, "p": 7, "tag": "整合实践", "title": "投资方针 · 你的个人宪法", "core": "投资方针(IPS)是你写给自己理财宪法。在你冷静的时候写下规则, 在你不冷静的时候遵守它。", "deep": "<p><b>1. 投资目标:</b> 这笔钱是用来干什么的?(退休?首付?) 目标金额? 什么时候需要用? 预期年化回报?(现实点: 7-10%税前)</p><p><b>2. 风险承受能力:</b> 最大能接受的回撤(20%还是50%)? 如果组合跌30%你能坚持什么也不做吗? 投资期限(3年、10年、30年)?</p><p><b>3. 资产配置:</b> 股票/债券/现金比例。美股/国际股票比例。</p><p><b>4. 投资纪律:</b> 定投计划、再平衡频率、什么时候允许偏离。</p><p><b>5. 禁止行为清单:</b> 绝不追涨、绝不做空、单仓不超过X%、绝不借钱投资、绝不在开盘前30分钟交易。</p>", "case": "# 你的投资方针\nmy_ips = {\n    'goal': '40岁时积累$XXX',\n    'horizon': '20年',\n    'max_drawdown': '30%',\n    'allocation': {'stocks':70,'bonds':20,'cash':10},\n    'rebalance': '每年1月1日',\n    'forbidden': ['margin','options selling','单仓>10%']\n}", "quiz": "花30分钟写你自己的第一版投资方针。打印出来贴在你能看到的地方——当你想偏离规则时它会拦住你。"}, {"d": 56, "p": 7, "tag": "整合实践", "title": "构建你的流程 · 从研究到执行", "core": "投资不是一系列孤立的交易, 而是一个持续运转的流程。好流程能让你在状态不好的时候依然做出不错的决策。", "deep": "<p><b>每日(10分钟):</b> 看一眼组合总值和主要仓位涨跌。注意是否有需要关注的新闻。没有重大变化就什么也不做。</p><p><b>每周(30分钟):</b> 检查组合vs基准。更新经济指标。检查仓位是否超过目标比例。</p><p><b>每月(1小时):</b> 读最新经济数据(NFP、CPI)。确认定投计划按计划执行。研究一个新公司。</p><p><b>每季度(2小时):</b> 读持仓公司财报。检查投资方针。执行再平衡。回顾投资日记。</p><p><b>每年(半天):</b> 全面回顾策略。评估表现vstarget。调整配置。反思: 学到了什么?</p>", "case": "# 投资流程时间表\nweekly = ['检查仓位', '更新经济指标']\nmonthly = ['定投执行', '研究一家新公司']\nquarterly = ['读持仓财报', '再平衡', '回顾日记']\nyearly = ['策略回顾', '调整配置', '年度反思']\n\n# 关键: 流程比结果更重要", "quiz": "基于上面的模板, 写你自己的每周/每月/每季度任务清单。从最简单的开始。"}, {"d": 57, "p": 7, "tag": "整合实践", "title": "资源与工具 · 你的工具箱", "core": "好的工具帮你节省时间、提高判断质量。这里列出了最实用的投资资源——不需要也用不完, 选几个用熟了就好。", "deep": "<p><b>免费但强大的资源:</b></p><ul><li><b>SEC EDGAR</b>(sec.gov): 所有上市公司原始财报——免费、完整、首要来源</li><li><b>Finviz</b>(finviz.com): 股票筛选器+可视化图表</li><li><b>TradingView:</b> 技术分析和社区</li><li><b>Yahoo Finance:</b> 快速查看基本数据</li></ul><p><b>数据API(程序员的优势!):</b></p><ul><li><b>yfinance</b>(Python): 免费拉取股价和财务数据</li><li><b>Alpha Vantage:</b> 免费API(有限额)</li></ul><p><b>书(读完3本已超越90%的人):</b></p><ol><li>《漫步华尔街》- 最好的入门</li><li>《聪明的投资者》- 价值投资圣经</li><li>《投资学》(Bodie) - 教科书但值得读</li></ol>", "case": "# 程序员的优势!\n# 用Python快速分析股票数据\npip install yfinance pandas\npython3 -c \"\nimport yfinance as yf\naapl = yf.Ticker('AAPL')\nprint(aapl.info['currentPrice'])\nprint(aapl.info['trailingPE'])\nprint(aapl.financials)\n\"", "quiz": "安装yfinance。拉一只你关注股票的关键数据(价格、P/E、收入趋势)。会写代码是你的投资超级优势。"}, {"d": 58, "p": 7, "tag": "整合实践", "title": "从错误中学习 · 经典投资教训", "core": "从别人的错误中学习比你亲自犯一遍更高效。每个教训背后都有无数人付过学费。", "deep": "<p><b>1. 击鼓传花(Greater Fool Theory):</b> 你买不是因为东西值这个价, 而是相信有人会用更高价接盘。经典: 2021年meme股票(GME)、2022年加密货币。<b>教训:</b> 永远买资产本身, 不要买'上涨的预期'。</p><p><b>2. 这次不一样(This Time Is Different):</b> 每轮泡沫最后阶段总有人说'这次不一样'。2000年互联网泡沫、2021年加密泡沫。<b>教训:</b> 每当你想说'这次不一样'时, 回去读一遍金融历史。</p><p><b>3. 杠杆的毒药:</b> 借钱投资可以放大收益, 也可以让一个正常回调把你清零。<b>教训:</b> 个人投资者永远不要加杠杆。</p><p><b>4. 过度交易:</b> 交易越频繁, 回报越低。<b>教训:</b> 买入后尽量少看盘——看多了就会想动, 动了就会犯错。</p>", "case": "# 过度交易杀手\ndef trading_kills_returns(trades_per_year):\n    if trades_per_year > 50:\n        return '交易频率过高, 回报低于市场'\n    elif trades_per_year > 12:\n        return '每月1次以上, 注意控制'\n    else: return '低频交易, 长期持有'", "quiz": "回想你见过或听说过的最大的投资错误。分析: 根本原因是知识不足还是心理因素? 你怎样避免?"}, {"d": 59, "p": 7, "tag": "整合实践", "title": "全景图 · 把一切连接起来", "core": "前59天的内容不是一个一个孤立的工具, 而是一张相互连接的网。今天把它们拼成一张完整的投资知识地图。", "deep": "<p><b>八个维度:</b></p><p><b>🧱 底层信念:</b> 市场大部分时候有效但不完美。分散化是唯一的免费午餐。长期持有比频繁交易好。</p><p><b>📊 分析工具:</b> 供需+激励+边际分析。三张财务报表+关键比率。估值(DCF+可比+历史区间)。</p><p><b>🎯 选股框架:</b> 能力圈内寻找。护城河识别(5种类型)。管理层质量评估。</p><p><b>📐 组合构建:</b> 资产配置(股债比例)。分散化(行业/地域)。仓位管理(单仓上限5-10%)。</p><p><b>⚖️ 风控:</b> 安全边际。止损纪律。现金缓冲。</p><p><b>🧠 心理:</b> 认知偏见识别。情绪管理。流程>直觉。</p><p><b>📈 宏观:</b> 利率周期。经济周期位置。全球资本流动。</p><p><b>🔄 流程:</b> 投资日记。定期回顾。学习迭代。</p>", "case": "// 投资知识体系 = 你的投资操作系统\nconst investmentOS = {\n  kernel:    ['市场效率', '分散化', '长期'],\n  drivers:   ['财务分析', '估值', '行业分析'],\n  monitor:   ['风控', '仓位管理', '情绪检测'],\n  io:        ['交易执行', '定投计划', '再平衡'],\n  logging:   ['投资日记', '季度回顾', '年度反思']\n};", "quiz": "用上面的八个维度, 给自己当前的投资知识水平打分(1-5分)。最低的那个——未来30天重点提升。"}, {"d": 60, "p": 7, "tag": "整合实践", "title": "第一个100天 · 从知道到做到", "core": "60天的学习在今天完成, 但真正的投资旅程现在才开始。知道和做到之间的距离——是一生的修炼。", "deep": "<p><b>第1-7天: 建立基础设施</b><br>- 开好券商账户并存入第一笔资金<br>- 写好你的投资方针<br>- 确定你的核心资产配置</p><p><b>第8-30天: 第一次行动</b><br>- 买入你的第一只ETF<br>- 建立投资日记<br>- 开始每周组合检查</p><p><b>第31-60天: 深入学习</b><br>- 研究一只你感兴趣的个股<br>- 读一家公司的10-K<br>- 了解你的第一份财报</p><p><b>第61-100天: 实战循环</b><br>- 执行一次小规模个股交易<br>- 完成第一次季报阅读<br>- 做了第一次再平衡(如有必要)</p><p><b>最后的话:</b> 你花了60天学的不是怎么暴富。你学的是一个有纪律的、可持续的、基于常识的投资方法。市场不会因为你学习了60天就给你奖励——它会先考验你。如果你在第一次亏损20%时依然坚持计划——那这60天的学习就值了。</p><p><b>记住: 投资不是比谁聪明, 是比谁活得久。</b></p>", "case": "# 从今天开始的行动\ndef my_first_100_days():\n    actions = [\n        {'week': 1, 'task': '开户并存入资金'},\n        {'week': 1, 'task': '写好投资方针'},\n        {'week': 2, 'task': '买入第一只ETF'},\n        {'week': 3, 'task': '建立投资日记'},\n        {'week': 5, 'task': '研究一只个股'},\n        {'week': 7, 'task': '读一家公司的10-K'},\n        {'week': 10, 'task': '第一次小规模个股交易'},\n        {'week': 12, 'task': '季度回顾'}\n    ]\n    return actions\n# 开始永远不晚, 晚的是永远不开始\nmy_first_100_days()", "quiz": "今天不做分析——做行动: 在上面'第一个100天'清单中选一项, 今天就完成它。行动是最好的学习。"}];

const PCLASS = {1:'tag-p1',2:'tag-p2',3:'tag-p3',4:'tag-p4',5:'tag-p5',6:'tag-p6',7:'tag-p7'};
const PNAME = {1:'经济思维',2:'市场工具',3:'公司分析',4:'投资框架',5:'宏观视野',6:'行为与纪律',7:'整合实践'};
let cur = 1;

function render(){renderPhases();renderGrid();renderDay(cur);}
function renderPhases(){
  const b=document.getElementById('phaseBar');b.innerHTML='';
  for(let p=1;p<=7;p++){
    const btn=document.createElement('button');
    btn.className='phase-btn';btn.textContent='P'+p+' '+PNAME[p];
    btn.onclick=()=>{const f=DAYS.find(d=>d.p===p);if(f)go(f.d);};
    b.appendChild(btn);
  }
}
function renderGrid(){
  const g=document.getElementById('dayGrid');g.innerHTML='';
  DAYS.forEach(d=>{
    const dot=document.createElement('button');
    dot.className='day-dot'+(d.d===cur?' active':'');
    dot.textContent=d.d;dot.onclick=()=>go(d.d);
    g.appendChild(dot);
  });
}
function renderDay(n){
  const d=DAYS.find(x=>x.d===n);if(!d)return;
  const core = d.core.replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const deep = d.deep;
  const caseHtml = d.case ? '<div class="block"><div class="block-title"><span class="ico">💻</span> 案例 · Case Study</div><div class="code-case">'+d.case+'</div></div>' : '';
  const quizHtml = d.quiz ? '<div class="block"><div class="block-title"><span class="ico">✍️</span> 题目 · Practice</div><div class="quiz-box"><div class="qt">'+d.quiz+'</div></div></div>' : '';
  document.getElementById('content').innerHTML = `
    <div class="day-card active">
      <div class="day-header">
        <span class="tag ${PCLASS[d.p]}">${PNAME[d.p]} · ${d.tag}</span>
        <h2>${d.title}</h2>
        <div class="sub">Day ${d.d} / 60</div>
      </div>
      <div class="block">
        <div class="block-title"><span class="ico">🎯</span> 核心观点 · Core Idea</div>
        <p>${core}</p>
      </div>
      <div class="block">
        <div class="block-title"><span class="ico">🧠</span> 深度理解 · Deep Understanding</div>
        ${deep}
      </div>
      ${caseHtml}
      ${quizHtml}
      <div class="nav-buttons">
        <button class="nav-btn" onclick="go(${n-1})" ${n<=1?'disabled':''}>← 上一篇</button>
        <button class="nav-btn" onclick="go(${n+1})" ${n>=60?'disabled':''}>下一篇 →</button>
      </div>
    </div>`;
  document.title='Day '+n+': '+d.title+' · Code to Capital';
  document.querySelectorAll('.day-dot').forEach(dot=>{dot.classList.toggle('active',parseInt(dot.textContent)===n);});
}
function go(n){if(n<1||n>60)return;cur=n;renderGrid();renderDay(n);window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('DOMContentLoaded',render);
</script>
</body>
</html>
