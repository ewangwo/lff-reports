.dc-sec{margin-bottom:12px}
.dc-sec .sl{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:#52525b;margin-bottom:3px;font-weight:600}
.dc-sec .sv{font-size:.85rem;line-height:1.65;color:#d4d4d8}
.dc-sec .sv.hl{color:var(--pc,#a855f7);font-weight:500}
.dc-rb{margin-top:12px;padding:14px;border-radius:8px;background:rgba(255,255,255,.02);border-left:3px solid var(--pc,#a855f7)}
.dc-nav{display:flex;justify-content:space-between;margin-top:16px;gap:8px}
.dc-nav button{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:.8rem;cursor:pointer;transition:.2s}
.dc-nav button:hover{border-color:var(--pc,#a855f7)}
.dc-nav button:disabled{opacity:.3;cursor:default}
.ft{text-align:center;padding:32px;color:#52525b;font-size:.75rem;line-height:1.6}
@media(max-width:640px){.grid{grid-template-columns:repeat(5,1fr);gap:6px;padding:14px}.day-sq .dt{display:none}.day-card{padding:18px}.dc-header h2{font-size:1rem}}
</style>
</head>

{"1": {"t": "稀缺性", "c": "你做的每件事都在放弃另一件事", "b": "经济学的思维方式 + 穷查理宝典", "e": "稀缺性是所有经济学的起点。不是不够用，而是你必须选。华为每天90分钟碎片时间你用来看盘还是学新模型？IBKR那么多标的你只精选4-5支，因为精力是稀缺的。", "u": "你在华为每天90分钟碎片时间，用来看盘、读研报、学新模型？每个选择都在放弃其他可能。你的IBKR仓位118万刀分散在4支股票——正是稀缺性下的主动选择。", "x": "写下你今天最稀缺的一种资源（时间/注意力/金钱），你把它用在了最重要的地方吗？", "p": "明天：机会成本"}, "2": {"t": "机会成本", "c": "做一件事的真正成本是放弃的最佳选项的价值", "b": "经济学的思维方式 + 经济学原理", "e": "你加班2小时的加班费是200元，但你不去跑步导致3个月后体检恶化——这200的时薪值吗？华为的股票增值是你的报酬，但你放弃的自由时间、健康、家庭时间都是你的机会成本。", "u": "你计划2027年6月离职——留在华为每年存65-69万RMB，但代价是被会议PPT消耗。提前走失去稳定现金流，但获得学习AI、管理投资、陪伴LEIEN的时间。", "x": "选一个你最近做的日常决策（周末加班vs休息），写下它的机会成本。", "p": "明天：边际分析"}, "3": {"t": "边际分析", "c": "多一小时多一百块的意义在哪", "b": "经济学的思维方式 + 思考快与慢", "e": "你在公司工作8小时后再加班1小时——产出效率从100%掉到40%，身体从80%掉到55%。边际收益下降，边际成本上升，决策黄金点在两者交叉的地方。", "u": "IBKR仓位再加1万到NVDA——如果NVDA已经占仓位的很大比例，多投一万的边际风险远大于边际收益。司美格鲁肽再多打0.5mg也是同样逻辑。", "x": "找一件你正在多做一些的事，画出它的边际收益曲线。", "p": "明天：比较优势"}, "4": {"t": "比较优势", "c": "即使你什么都比人强，也只做最擅长的", "b": "经济学的思维方式 + 国富论", "e": "你写代码比实习生快10倍，整理表格比实习生快2倍——你的比较优势在写代码。把整理表格外包出去，双方都受益。投资中你花2小时研究MU赚10个点理解优势，花2小时研究日本央行只赚1个点。", "u": "华为销售8年——比较优势在大客户关系、华为内部流程、AI算力需求判断。比较劣势在行政事务、报销流程、PPT美化。离职前最后一年聚焦高价值客户维护。", "x": "列出你最有优势的3件事和最低效的3件事，怎么重新分配时间？", "p": "明天：复利"}, "5": {"t": "复利", "c": "持续的小改善经过足够时间产生指数级效果", "b": "穷查理宝典 + 思考快与慢", "e": "每天30分钟书×365=182小时。每天3公里×365=1095公里。每天学一个概念×60=60个判断模型。复利不仅在金钱上，知识、健康、人际关系同样如此。方向对了，时间是你的朋友。", "u": "2030目标1000万RMB+100万USD。IBKR 588K+华为年薪+ESOP+年化8-10%复利——可达。关键是方向对、不中断、不在恐慌时清仓。", "x": "选一个生活中在复利方向上的习惯（投资/学习/健康），算3年累积效果。", "p": "明天：系统思维"}, "6": {"t": "系统思维", "c": "世界不是孤立事件，是相互连接的系统", "b": "穷查理宝典 + 管理学", "e": "华为下调服务器价格→影响你的销售业绩→影响年终奖→影响IBKR定投→影响2030目标。动一头必然牵动另一头。你的健康也是系统：睡眠→精力→工作效率→加班→锻炼→体检。", "u": "双机架构是系统思维的产物：Pro 24h底座跑cron+监控，Air随身跑Codex。空气到Pro的桥接通过iCloud，如果iCloud断了整个系统停摆——需要设计备降方案。", "x": "画出你生活中最重要的一个系统（投资/健康/工作），标出关键节点和薄弱点。", "p": "明天：概率思维"}, "7": {"t": "概率思维", "c": "世界是概率的，用赔率代替非黑即白", "b": "思考快与慢 + 穷查理宝典", "e": "大部分人用要么发生要么不发生的二元思维。高手用70%概率发生30%不发生的概率思维。MU涨到1600的概率40%，跌到700概率10%，横盘50%——这个赔率值得下注吗？", "u": "四道硬线本身就是概率思维：个股上限15%是在说无法确定哪支一定涨，但不管哪支崩了我不破产。每支股票锁死仓位上限，就是在为判断不一定对买保险。", "x": "选一个投资判断，给自己一个置信度百分比，听听不同意见后重新打分。", "p": "明天：贝叶斯更新"}, "8": {"t": "贝叶斯更新", "c": "判断不是一成不变的，每收到新信息就该调整一次", "b": "思考快与慢 + 经济学原理", "e": "先有初始判断（先验概率），根据新证据更新（后验概率）。NVDA之前认为H100消退后会跌，看到Blackwell订单和Rubin路线图——判断上调了多少？很多人打死不认错或墙头草。", "u": "MU目标价从800到1600经历了多次更新：HBM3E供应紧张→数据中心支出超预期→AI推理需求爆发→三星HBM3E认证推迟。每次都是新证据推动更新。", "x": "选一个持仓，写下当前判断和支撑它的3个最强证据。", "p": "明天：二阶效应"}, "9": {"t": "二阶效应", "c": "每个行动有直接效果和二层效果", "b": "穷查理宝典 + 思考快与慢", "e": "一阶：降息→股市涨。二阶：降息→通胀升→央行被迫加息→股市跌。只看一阶的人蜂拥买入，看二阶的人高位卖出。每个决策都要问：然后呢？再然后呢？", "u": "你决定2027年6月离职——一阶：自由了。二阶：失去稳定现金流和ESOP收益，需投资收益覆盖生活。三阶：投资风格可能从长期变进取，打破四道硬线。四阶：心态变化影响与LEIEN的关系和健康。", "x": "选最近一个重大决策，追问三次然后呢。", "p": "明天：反脆弱性"}, "10": {"t": "反脆弱性", "c": "有些东西在冲击和混乱中变得更强", "b": "反脆弱 + 黑天鹅", "e": "塔勒布的三分法：脆弱的（杯子碎了）、强韧的（铁球没事）、反脆弱的（撞地反弹更高）。投资组合应反脆弱——不仅不崩盘，还能在波动中获益。认知体系也应反脆弱——被不同观点冲击后更强。", "u": "IBKR 118万刀在科技股（脆弱），25%现金等抄底（反脆弱）。关键是崩盘时真能执行买入吗？四道硬线中现金≥15%就是反脆弱设计。", "x": "检查组合中脆弱和反脆弱的部分。", "p": "明天：奥卡姆剃刀"}, "11": {"t": "奥卡姆剃刀", "c": "多个可能解释中选择最简单假设最少的", "b": "逻辑学导论 + 穷查理宝典", "e": "股市大跌时有人说是阴谋、有人说是bug、有人说是地缘政治。最简单的解释往往最可信：利率上升，估值压缩。少编故事，多看事实。", "u": "MU一天跌5%，最简单的可能是全半导体板块在跌，而非美光出问题。LEIEN没回消息——最简单的可能是她在开会，而非故意冷落你。", "x": "回忆一个最近认为很复杂的问题，用一句话解释它。", "p": "明天：认知偏差总览"}, "12": {"t": "认知偏差总览", "c": "你的大脑充满系统性偏差", "b": "思考快与慢 + 穷查理宝典", "e": "确认偏误只找支持自己的证据。可得性启发高估最近事件的概率。理解偏差不是消除它（不可能），是在关键决策时加一层检查。", "u": "亏钱经历都能找到偏差：锚定效应(NVDA 300没买觉得500贵了)、损失厌恶(跌10%死扛到30%)、确认偏误(只读MU利好)。把这些偏差写下来放在交易台旁边。", "x": "写3种最易犯的认知偏差，每种配一个安全检查动作。", "p": "明天进入Phase 2：理解人"}, "13": {"t": "确认偏误", "c": "你只寻找记住相信支持自己已有观点的信息", "b": "思考快与慢 + 社会心理学", "e": "买了NVDA后自动过滤看空报告。不是看空不存在，是大脑屏蔽了它们。破解：主动找反面观点。每次买入前先读三篇看空报告。", "u": "对华为的认知也有确认偏误——看到越来越好忽略信号。对LEIEN也是——只注意到她理解你忙的时候，忽略她说我想你多陪陪我的信号。", "x": "选一个坚信的观点，主动搜索3条相反证据。", "p": "明天：可得性启发"}, "14": {"t": "可得性启发", "c": "你高估容易想起来的事情的概率", "b": "思考快与慢 + 心理学导论", "e": "飞机失事比车祸更被媒体关注，所以你高估空难概率——实际车祸致死率远高于空难。股市：NVDA一天跌8%刷屏让你觉得科技股危险——拉长3年涨了3倍。", "u": "IBKR下跌时觉得市场完了，但两年损益表大部分时间震荡向上。工作上最近一次协商失败让你觉得华为客户难搞——统计全年成功率远高于失败率。", "x": "选一个你最近担心的风险，查客观发生概率，你高估了多少？", "p": "明天：锚定效应"}, "15": {"t": "锚定效应", "c": "最先接触的数字成为参考点影响所有后续判断", "b": "思考快与慢 + 行为经济学", "e": "中介先带你看了3000万的房子，2000万那个看起来划算。MU在800没买，现在1400觉得太贵了——但到1600还有14%空间，被800的锚点歪曲了判断。", "u": "对每支股票的判断都被买入价锚定了。MU 760买入现在1400觉得涨够了——但目标价1600还有14%空间。NVDA 420买入现在1070觉得涨太多——但EPS在增长P/E可能并没更贵。", "x": "假装没持有这支股票，用当前价重新评估买入逻辑。", "p": "明天：损失厌恶"}, "16": {"t": "损失厌恶", "c": "失去的痛苦约等于得到的2倍快乐", "b": "思考快与慢 + 行为经济学", "e": "亏10%的痛苦约等于赚20%的快乐。导致两个危险行为：过早卖出盈利股（怕利润消失）、死扛亏损股（不愿认赔）。正确做法反过来：让盈利股飞，及时止损。", "u": "回看IBKR交易记录——是否更容易卖出盈利股而持有亏损股等回本？四道硬线中的止损线就是为了对抗这个天性。2027离职后全职投资，这是头号敌人。", "x": "检查有没有因为等回本而持有的亏损股？清零重新配置还会选它吗？", "p": "明天：社会证明"}, "17": {"t": "社会证明", "c": "不确定时你倾向于模仿大多数人的行为", "b": "社会心理学 + 影响力", "e": "进化上有用——但股市里所有人买时是顶，所有人卖时是底。2021年大家都买加密货币是顶，2022年大家都卖科技股是底。跟着群体走赚不到超额收益。", "u": "离职决定周围没人这么做——华为同事大多熬到退休。但你的模型告诉你到2030年投资可覆盖生活，健康恶化，需要学AI陪家人。你的判断可能比大多数人更正确。", "x": "选最近一个跟风决定。如果只有你一个人做决策，结果会不同吗？", "p": "明天：权威偏误"}, "18": {"t": "权威偏误", "c": "你倾向于更相信权威人士的观点", "b": "社会心理学 + 心理学导论", "e": "米尔格拉姆实验：穿白大褂的人说继续你就继续施加电击。分析师说MU目标价1600你就买了——但他6个月前还说目标价600。CEO说我们非常乐观——他会说别的吗？", "u": "区分分析师是真有洞见还是做本职工作。Aletheia的1600目标价依据是什么？历史预测准确率如何？客户说我们需要更低价格——可能只是在锚定你。", "x": "找个因某某说而相信的观点，质问：你信的是逻辑还是身份？", "p": "明天：框架效应"}, "19": {"t": "框架效应", "c": "同一信息用不同方式表达导致完全不同决定", "b": "思考快与慢 + 影响力", "e": "存活率90% vs 死亡率10%——同一事实前者让你更愿手术。这支股票有70%概率涨 vs 有30%概率跌——你更倾向买入前者描述。怎么说比说什么更重要。", "u": "你作为华为销售每天都在用框架效应。当别人对你用时学会转译：把这个风险很低转译成损失概率多少金额多少。", "x": "把最近一条建议重新框架化（利好翻风险或反之），判断是否还可信。", "p": "明天：心理账户"}, "20": {"t": "心理账户", "c": "你给不同来源用途的钱设了不同账户", "b": "行为经济学 + 穷查理宝典", "e": "工资省着花、投资收益敢消费、意外之财随便花——但银行不区分这些钱。年底发10万奖金会奖励自己，但如果是月固定收入会更谨慎。所有钱都是你的钱。", "u": "ESOP解锁、年终奖、IBKR收益——在大脑里被分到不同篮子。但都是总资产的一部分。四道硬线应覆盖整体而非分账户。离职后只有投资收益——需提前适应心理转换。", "x": "检查不同来源的钱是否有不同宽松度？统一标准。", "p": "明天：自我归因 vs 基本归因错误"}, "21": {"t": "归因错误", "c": "成功归能力失败归环境，对别人反过来", "b": "社会心理学 + 心理学导论", "e": "赚了钱是因为我研究得透，亏了钱是因为市场非理性。同事升职是因为他会拍马屁。永久的双标。破解：每次成功问运气成分，每次失败问我哪里做错了。", "u": "过去一年IBKR收益多少是判断正确，多少是AI牛市水涨船高？2022年同样仓位还赚钱才是能力。离职后全职投资必须分清楚这两个因素。", "x": "对最近一个成功和一个失败重新归因，打能力vs运气比例。", "p": "明天：认知失调"}, "22": {"t": "认知失调", "c": "行为与信念冲突时你倾向于改变信念而非行为", "b": "社会心理学 + 心理学导论", "e": "MU跌10%不卖——安慰自己基本面没问题，HBM需求强劲回调是买入机会。真正的自信是重新评估：逻辑不变加仓，逻辑变就止损。改变信念或行为都没问题，有问题的是假装什么都没变。", "u": "离职决策也可能触发——离职后第一年亏15%可能说才第一年要耐心，也可能美化华为。保持诚实面对自己。", "x": "找行为与信念冲突的例子——嘴上说重要但没行动的事。", "p": "明天：习得性无助"}, "23": {"t": "习得性无助", "c": "反复失败后你放弃尝试即使条件已改变", "b": "心理学导论 + 进化心理学", "e": "狗被电击逃不掉就放弃了——即使后来门开了。股市连续亏损后相信我一买就跌——于是大涨行情中踏空。早期亏损可能只是运气不好。", "u": "你的离职计划本身是在对抗习得性无助。多数人40多岁觉得这辈子就这样了。你没有，花大量时间配置资产和学习。警惕在锻炼或改善关系上可能有习得性无助。", "x": "找出你因为试过没用而放弃的领域，条件改变了吗？", "p": "明天：成长型思维"}, "24": {"t": "成长型思维", "c": "能力可以通过努力发展，不是固定不变的", "b": "成长型思维 + 心理学导论", "e": "固定型：我学不会AI、我不擅长投资。成长型：我现在还不会AI但每天15分钟花一年能入门。核心区别不是能力高低，是对失败的定义——我失败了 vs 我需要换方法。", "u": "44岁学AI、定60天计划、准备离职转型——这就是成长型思维。检查隐藏角落：我就是不擅长锻炼（固定型）vs 我还没找到适合自己的运动方式（成长型）。", "x": "三个领域改为我暂时还不行：工作、投资、健康。", "p": "明天：进化心理学"}, "25": {"t": "进化心理学", "c": "你的大脑是为草原设计的，不是为股市设计的", "b": "进化心理学 + 思考快与慢", "e": "草原上听见草丛有声音你逃跑——如果只是风声白消耗能量，如果是狮子不逃被淘汰。所以对威胁过度敏感。股市每天看盘对下跌过度反应——草原大脑作祟。", "u": "原始大脑追求短期安全（及时止盈）vs 长期收益（持有好公司），对波动敏感（小跌慌）vs 波动中机会（大跌是买入）。四道硬线就是客制化原始大脑的工具。", "x": "写原始大脑驱动的行为，设计系统对抗它。", "p": "明天：亲社会行为"}, "26": {"t": "亲社会行为", "c": "利他最终也是利己", "b": "进化心理学 + 社会心理学", "e": "互惠利他（今天帮你明天你帮我）、群体选择（合作比内斗更易生存）、地位信号（帮人展示资源）。职场客户关系本质是长期互惠。", "u": "华为8年积累的客户关系是亲社会资本——你帮客户解决问题，他预算紧张时优先考虑你。与LEIEN的关系也需要每天的小利他维护——不是节日送礼是日常分担。", "x": "今天做一件纯利他的小事不期待回报，观察感受。", "p": "明天：沟通四层模型"}, "27": {"t": "沟通四层模型", "c": "每次对话在四个层面同时进行", "b": "沟通的艺术 + 社会心理学", "e": "事实、情感、关系、诉求。LEIEN说你又加班了——事实：你加班了。情感：她失望。关系：你花在工作上的时间比陪她多。诉求：能不能早回来一次？只回事实就错过下面三层。", "u": "和LEIEN的困境：她说你每天都在看手机（表面），实际是我想你陪我说说话（情感+关系）。你回在看美光研报（事实）——全错。应回应：你是不是觉得我没关注你？今晚放下手机陪你。", "x": "下次分歧先停3秒：对方在哪个层面说话？你在哪个层面回应？", "p": "明天：情绪与认知整合"}, "28": {"t": "情绪与认知整合", "c": "理解和预测你的情绪反应是理性决策的第一步", "b": "思考快与慢 + 心理学导论 + 沟通的艺术", "e": "确认偏误、损失厌恶、认知失调、社会证明——不是缺陷是天性。关键不是消灭它们（做不到）而是在关键决策前设检查站。", "u": "每个重大决策过四问：1.有没有只找支持自己的证据？2.有没有被初始数字锚定？3.有没有因为大家都这样而跟风？4.有没有因为不想认错而坚持？过完四问再决策。", "x": "选3个最实用的模型写手机备忘录。", "p": "明天进入Phase 3：组织与社会"}, "29": {"t": "科层制", "c": "大型组织按层级和规则运行", "b": "组织行为学 + 管理学", "e": "Bureaucracy不是贬义词——固定层级、明确分工、非个人化规则让大规模协作成为可能。但副作用：僵化、官僚主义、信息衰减、创新被扼杀。", "u": "华为8年深知科层制的优缺点。LTC流程、IPD流程、EMT会议体系——知道如何绕道：直接找关键决策人。离职后将失去这个熟悉的结构，既是解脱也是挑战。", "x": "列华为科层制中3个顺手工具和3个头疼障碍。", "p": "明天：彼得原理"}, "30": {"t": "彼得原理", "c": "每个人最终会升到无法胜任的位置", "b": "组织行为学 + 管理学", "e": "销售出色→升区域经理管团队→如果出色继续升→直到能力配不上→停在此处。每个组织大部分管理层由不胜任的人占据。", "u": "见过不少人到某个级别后停住。你选择2027年主动离职是聪明的——在还行的时候离开，而不是等到不行了被动出局。", "x": "当前岗位有超配或接近天花板的感觉吗？哪些是真正擅长的？", "p": "明天：帕金森定律"}, "31": {"t": "帕金森定律", "c": "工作会自动膨胀直到占满你分配的所有时间", "b": "管理学 + 经济学的思维方式", "e": "给2小时就用2小时，给8小时就用8小时——多6小时摸鱼和纠结。大公司经常加班不是工作真多，是时间被分配太多自动膨胀了。", "u": "双机架构是反帕金森设计——Pro跑cron和监控不需你盯着，Air高效工作。华为的会议就是时间膨胀——30分钟能解决的放到1小时变1小时。离职后可能反向膨胀。", "x": "今天任务时间减半，试试能否完成。", "p": "明天：交易成本"}, "32": {"t": "交易成本", "c": "当市场交易成本高于内部管理时企业诞生", "b": "经济学的思维方式 + 组织行为学", "e": "为什么有公司？找人帮忙太贵（搜索、签约、监督、违约成本）。所以把一群人放公司内通过管理协作。当市场交易成本降低时公司变小。", "u": "离职后成为个体投资者就是在降低交易成本——不再参会写周报走审批。也要自己承担以前公司替你的：无固定收入、无社保、无同事网络。AI时代交易成本持续下降。", "x": "列出未来个人公司有哪些交易成本，怎么降低？", "p": "明天：委托代理"}, "33": {"t": "委托代理问题", "c": "代理人倾向于自己利益而非委托人利益", "b": "经济学 + 组织行为学", "e": "基金经理收管理费不一定在乎你收益——他追求基金规模，你追求绝对收益。公司治理核心就是解决这个：用股权激励让CEO也变股东。", "u": "你在华为同样是代理人——客户委托你解决需求，公司委托你服务。三方利益不完全一致。IBKR投资是你自己的钱——委托人=代理人，最纯粹。", "x": "识别最近的代理人，想他的利益和你有多大差异。", "p": "明天：公地悲剧"}, "34": {"t": "公地悲剧", "c": "资源属所有人时没人保护", "b": "经济学 + 国家的常识", "e": "公共草地每人都想多养羊→草没了。公地WiFi被滥用、开源项目缺维护。解决方案：私有化、政府管制、社区自治。", "u": "你的时间和注意力是个人公地——各种需求争夺：会议、客户电话、看盘、刷新闻、学AI、陪家人。不设边界会被耗尽。离职就是私有化你的时间。", "x": "日程中哪些是被免费占用的公地？设了边界吗？", "p": "明天：搭便车"}, "35": {"t": "搭便车", "c": "不出力也能享受好处", "b": "经济学 + 社会心理学", "e": "小区集资装路灯——我不出钱照样能用。人人都这样路灯永远装不起来。解决方案：强制征收、转化私人物品、强化社会规范。", "u": "华为有些人出最少力拿平均绩效。你的学习计划每天cron推送内容——只接收不练习就在搭便车。投资也一样——自己研究出硬线是贡献者，跟风买别人推荐是搭便车者。", "x": "找出你搭便车和被搭便车的领域各一个。", "p": "明天：囚徒困境"}, "36": {"t": "囚徒困境", "c": "缺乏信任时理性人做对双方不利的决定", "b": "经济学 + 穷查理宝典", "e": "两个嫌犯分开审讯——都沉默各1年，互相供出各5年，一个人供人无罪另一个10年。从个人看供出更有利→互相供出各5年。最优结果（都沉默1年）因缺乏信任不可达。", "u": "价格战就是囚徒困境——你降我跟着降利润都下降，你降我不降你抢客户。最优策略都不降但缺乏信任。婚姻某些互动也是。", "x": "想一个最近的囚徒困境场景，用沟通建立信任打破它。", "p": "明天：协调博弈"}, "37": {"t": "协调博弈", "c": "双方利益一致但需要协调行动", "b": "经济学 + 管理学", "e": "和囚徒困境不同，协调博弈双方有共同利益但不确对方选择。今晚去哪吃双方都想火锅没说出口各吃各的。谈判中双方都想达成协议但等对方先让步。", "u": "和LEIEN的分歧可能不是利益冲突而是协调问题——她希望陪你时百分百投入你也想做到但没说完。设定明确我们时间和我的时间就是协调方案。", "x": "找双方都想但没做成的事，直接说出意图问怎么配合。", "p": "明天：社会规范"}, "38": {"t": "社会规范", "c": "看不见的规则支配你的行为", "b": "社会心理学 + 国家的常识", "e": "违反社会规范代价不是坐牢是被排挤失去信任。法律管底线，社会规范管日常。华为里你讲PPT时别人大声接电话——法律没禁止但被同事排挤。", "u": "华为8年已内化其社会规范。离职后进入新环境（自由者社群、投资者圈子、AI社区）每个圈子有自己规范。投资者圈子：不炫耀收益率、不打听仓位、不传播未核实信息。", "x": "观察新圈子识别3条不说出来的规则。", "p": "明天：权力距离"}, "39": {"t": "权力距离", "c": "不同文化对权力不平等的接受程度不同", "b": "组织行为学 + 国家的常识", "e": "高权力距离（中国日本）下属不公开反对领导。低权力距离（丹麦以色列）直呼其名挑战领导是健康讨论。没有对错，不同环境要不同沟通策略。", "u": "华为中等偏高——可提意见但注意方式。国企客户高权力距离和民企低权力距离策略完全不同。LEIEN 94年新一代对权力距离容忍度更低——你以我是你老公所以听我的姿态说话适得其反。", "x": "最近沟通中权力姿态和对方匹配吗？下次怎么调整？", "p": "明天：文化维度全景"}, "40": {"t": "文化维度全景", "c": "6个维度理解不同文化差异", "b": "组织行为学 + 国家的常识", "e": "权力距离、个人主义vs集体主义、男性气质vs女性气质、不确定性规避、长期导向、放纵vs克制。为什么不同国家做事方式如此不同。", "u": "华为是高权力距离+高集体主义+高长期导向——习惯听安排、团队优先、忍受短期痛苦。美国投资市场是低权力距离+高个人主义+低长期导向——追求短期收益。离职后需在两套文化间切换。", "x": "用6维度描述你和LEIEN的文化差异。", "p": "明天：突破性创新"}, "41": {"t": "突破性创新", "c": "真正改变格局的是做得不一样而非做得更好", "b": "组织行为学 + 管理学", "e": "渐进式：摄像头1200万到4800万像素。突破性：AI生成照片不需要摄像头了。柯达发明数码相机不敢推广→被干掉。突破性创新刚开始看起来不怎么样但最终颠覆行业。", "u": "AI是当前最大突破性创新。你用Codex/Hermes双机、用AI分析研报——已在利用。但多少人只是用AI替写周报（渐进），而不是重新定义工作方式（突破）？你的学习计划本身就是突破。", "x": "选一个领域问从零用AI重新设计怎么做？", "p": "明天：弱连接"}, "42": {"t": "弱连接", "c": "给你带来最多机会的不是密友而是不太熟的熟人", "b": "社会心理学 + 组织行为学", "e": "找到新工作的人大多通过弱连接——不常联系的熟人前同事活动上认识的。强连接圈子和你的信息高度重叠。弱连接连接另一个世界。", "u": "离职后新机会不在华为同事圈（共享相似行业认知），在之前客户、行业会议换名片的人、AI学习群网友。华为8年客户网络本质是弱连接——商业关系而非密友，但最能带来新机会。", "x": "列有价值但最近没联系的弱连接名单，主动发消息。", "p": "明天：结构洞"}, "43": {"t": "结构洞", "c": "在两个不相连群体间充当桥梁的人最值钱", "b": "社会心理学 + 组织行为学", "e": "你在A圈（华为销售）知道内部流程策略，在B圈（AI投资者）知道技术趋势投资逻辑。连接两个圈子——给AI投资者讲华为算力需求对应哪些供应商受益→占据结构洞不可替代。", "u": "AI投资（美股）+华为工作（国内科技）+AI工具使用（Codex双机）三者间天然占据结构洞。大多数分析师只懂一方。离职后核心价值是翻译者。", "x": "列出你所在的3个圈子，在哪两个之间能充当桥梁？", "p": "明天：信息瀑布"}, "44": {"t": "信息瀑布", "c": "当大家都这么说时可能是错的", "b": "社会心理学 + 思考快与慢", "e": "两家餐厅第一家来了几个客人第二家空——路人觉得第一家肯定好吃也进去了。最早客人只是随机选的。2000年互联网泡沫、2021年meme股全是信息瀑布。后续跟进的人在模仿。", "u": "买入MU可能也是信息瀑布——Aletheia出1600目标价，多家跟进，你也买了。你是第几个下单的？最早就HBM3E供需的那批享受了红利。只是看到1600研报就买已在瀑布中下游。", "x": "复盘最近买入：信息源头还是瀑布跟随者？", "p": "明天进入Phase 4：系统与经济"}, "45": {"t": "复利第二层", "c": "复利方向比速度重要", "b": "穷查理宝典 + 经济学", "e": "正向复利：知识积累、财富增长、健康改善。反向复利：坏习惯恶化、负债膨胀、疾病加重。每月多花3000消费贷复利 vs 每月定投3000复利——方向决定命运。", "u": "IBKR 588K是正向复利机。每月定投、ESOP重新配置、tax loss harvesting。但你健康是反向复利——脂肪肝+ALT高+血糖临界+睡眠不足，不管5年后变代谢综合征。", "x": "检查正向和反向复利机各3台，哪些在加速减速？", "p": "明天：马太效应"}, "46": {"t": "马太效应", "c": "凡有的还要给他更多", "b": "经济学 + 穷查理宝典", "e": "有100万本金年化10%就是10万。没本金靠工资存10万要一年。差距越来越大。你8年华为销售经验别人要花8年追上——经验优势也是马太。", "u": "IBKR 588K年化10%赚58K，别人100本金赚10——马太。你的策略：不是追求极端收益率（ALL IN翻倍快感），是稳定中高收益率（复利+马太加持下时间帮你赢）。", "x": "选一个有马太优势的领域，怎么用它拉开差距？", "p": "明天：均值回归"}, "47": {"t": "均值回归", "c": "极度好和差的表现之后会回到平均值", "b": "思考快与慢 + 经济学原理", "e": "统计必然——极端值是多种因素叠加，随机因素消失后回到常态。股票一年涨200%下年大概率不继续——不是该跌了是那200%很多是一次性因素。", "u": "过去一年IBKR收益可能高于长期均值（AI牛市）。均值回归意味着未来几年可能低于此。2030目标需打折——不用过去两年高回报率推未来4年，用7-10%名义年化。", "x": "过去两年收益/绩效/健康做均值回归预测，回归后计划还走得通吗？", "p": "明天：黑天鹅"}, "48": {"t": "黑天鹅", "c": "不可预测但影响巨大的事件", "b": "黑天鹅 + 反脆弱", "e": "三要素：异常值、极端冲击、事后人们编理由显得可预测。疫情、2008金融危机、9/11。关键不是预测（你预测不到）是让系统遇到时不仅不崩溃还能受益。", "u": "四道硬线在应对黑天鹅：分散4标的、现金≥15%、个股上限15%。但真准备好了吗？AI泡沫破裂NVDA一天跌30%，心理能承受吗？硬线的执行纪律够吗？", "x": "设计黑天鹅场景，你的系统能扛住吗？", "p": "明天：灰犀牛"}, "49": {"t": "灰犀牛", "c": "显而易见但被忽视的风险", "b": "反脆弱 + 管理学", "e": "很大很慢很明显但你不躲。全球变暖科学家喊30年大家还在争论真假。你的健康也是灰犀牛：脂肪肝→肝硬化→肝癌要15年但你总说明天再锻炼。", "u": "灰犀牛清单：1.健康：ALT+脂肪肝+血糖+睡眠+司美依赖→5年代谢综合征。2.投资：AI牛市过度自信。3.关系：离职后24小时在一起和LEIEN相处模式需重构。4.技能：只有华为8年销售经验。", "x": "写3头灰犀牛和最迟必须面对的日期。", "p": "明天：科斯定理"}, "50": {"t": "科斯定理", "c": "产权清晰比政府干预更重要", "b": "经济学 + 法律之门", "e": "工厂噪音影响医生诊所——不管法律判谁赔，最终谁更在乎资源价值谁去解决。产权清晰+交易成本低→资源自动最优配置。", "u": "你的产权是什么？华为客户关系是你的还是公司的？行业认知是你自己的还是华为的？AI学习内容你拥有IP吗？离职前想清哪些能带走哪些带不走。", "x": "盘点个人资产产权：哪些离职后仍属于你？哪些会失去？", "p": "明天：比较制度分析"}, "51": {"t": "比较制度分析", "c": "制度没有绝对优劣只有是否适应特定环境", "b": "国家的常识 + 经济学", "e": "美式资本主义（华尔街+风投+灵活雇佣）催生硅谷。德式（银行主导+工会强大+培训）催生高端制造。不是谁优是适合不同产业。", "u": "你接下来做全职个人投资者（美式高风险自主）+AI创业者（美式灵活试错）？适应了华为高权力距离+高竞争+高回报的制度但选择离开。新制度需自己设计。", "x": "为未来设计3条个人制度基本原则。", "p": "明天：法律威慑"}, "52": {"t": "法律威慑", "c": "法律真正作用是让守法者相信坏人会被惩罚", "b": "法律之门 + 经济学", "e": "检测概率比惩罚力度更有效——不是害怕死刑，是我知道会被抓。投资中的法律是你的交易纪律：不是不能追高，是追高后违反四道硬线的自我惩罚。", "u": "四道硬线是你给自己设置的法律。但威慑取决于执行——NVDA一飞冲天追到18%仓位说下周调回来——威慑失效。真实法律需要真实惩罚。", "x": "为投资法律加一条违法处罚条款（超仓位减仓捐5%？三天不能看盘？）", "p": "明天：激励相容"}, "53": {"t": "激励相容", "c": "让追求自己利益的人客观上实现设计者目标", "b": "经济学 + 组织行为学", "e": "不是道德说教是设计框架让人为自己利益做好事。销售提成制——销售为自己收入努力卖货→公司营收增长。股权激励——CEO为股票增值努力→股东获益。", "u": "IBKR现金15%规则——保留现金不是为了纪律而是为了崩盘时有子弹。对自己的激励是要在低位买入更多而不是被迫持有。学习也一样——不是应该每天学而是学一个模型→做出更好判断→更赚钱。", "x": "最近需要别人配合的事设计双方受益的激励方案。", "p": "明天：货币非中性"}, "54": {"t": "货币非中性", "c": "钱的数量变化真实影响经济产出和分配", "b": "经济学原理 + 经济学", "e": "央行印钱不是均匀撒向所有人。先拿到钱的（金融机构大企业）享受资产升值，后拿到的（工薪族）承担通胀成本。2020美联储撒钱先流入华尔街→股市暴涨→富人更富→通胀→普通人受损。", "u": "理解这个帮你预判宏观：降息不是直接股市涨，是先拿到便宜钱的人推高资产价格再传导。AI最先受益因为融资成本低最先拿到新钱扩张。你的MU和NVDA正在受益。", "x": "观察货币环境，你的持仓性质（谁先拿到新钱）匹配吗？", "p": "明天：菲利普斯曲线"}, "55": {"t": "菲利普斯曲线", "c": "短期通胀和失业存在替代关系", "b": "经济学原理 + 经济学", "e": "失业高→央行降息刺激→失业下降→通胀上升。通胀高→央行加息冷却→失业上升→通胀下降。决策者永远在做痛苦权衡。软着陆很难。", "u": "理解这个帮你预判央行行为。通胀反弹即使就业在恢复美联储可能也必须鹰派。你的成长股（AI标的）在加息周期中估值承压。", "x": "检查宏观环境：通胀趋势？就业数据？美联储最可能在哪个平衡点行动？", "p": "明天：滞胀"}, "56": {"t": "滞胀", "c": "最可怕的宏观组合：停滞+失业+通胀", "b": "经济学原理 + 经济学", "e": "经济停滞+高失业+高通胀——决策者噩梦。加息让失业更恶化，降息让通胀更恶化。1970持续近10年直到利率提到20%。滞胀中什么好：大宗商品、黄金。什么不好：几乎所有股票债券。", "u": "P(滞胀)=5%，影响=-30%组合。你有一张防滞胀牌吗？做空工具、黄金ETF、更多现金？15-25%现金已有一定防御但真正危机够吗？", "x": "假设2027滞胀IBKR怎么变？离职计划需调整吗？", "p": "明天进入Phase 5：整合复盘"}, "57": {"t": "跨学科思维地图", "c": "你不是要成为每个学科的专家", "b": "穷查理宝典 + 全部18本书", "e": "如果你只有锤子看所有东西都是钉子。每个学科核心模型就是工具箱：经济学稀缺性、心理学认知偏差、社会学社会证明、物理临界点、生物进化。放在一起用不是分科用。", "u": "8个模型组成底层操作系统：1.稀缺性→时间分配 2.机会成本→选择有代价 3.复利→方向比速度 4.系统思维→整体非局部 5.概率思维→赔率思考 6.贝叶斯→新证据调整 7.认知偏差→不信任第一反应 8.反脆弱→从波动获益。", "x": "把前56天核心概念写纸上画连接，找3条没想到的交叉连接。", "p": "明天：个人战略规划"}, "58": {"t": "个人战略规划", "c": "把知识地图变成行动", "b": "心理学导论 + 管理学", "e": "PDCA循环：Plan（模型分析设目标）→ Do（执行）→ Check（结果用贝叶斯调整）→ Act（修正方向）。不是一年定一次是持续循环。", "u": "2030目标=1000万RMB+100万USD。倒推：588K+华为年薪+ESOP+年化7-10%。Do：月定投、严守四道硬线、周仓位检查。Check：月度对比基准、季度压力测试。Act：偏离20%重新评估。", "x": "用PDCA写3个月个人战略（投资/学习/健康各一）。", "p": "明天：情绪纪律"}, "59": {"t": "情绪纪律", "c": "所有计划最后会被情绪摧毁", "b": "思考快与慢 + 心理学导论", "e": "你有世界上最好的投资策略，但当仓位一天跌5%你情绪不让你执行就没有意义。情绪纪律不是没有情绪，是在情绪最强烈的时刻按提前写好的计划行动。", "u": "四道硬线是情绪纪律工具，需要极端情况训练：1.NVDA一天跌15%你怎么办？2.美光1400跌回800三个月腰斩你怎么办？3.焦虑到睡不着每天看盘4小时你怎么办？现在想好写下来。", "x": "写给未来恐慌的自己的信——真实具体带数字。", "p": "明天：复利人生"}, "60": {"t": "复利人生", "c": "60天后真正的学习才刚刚开始", "b": "全部18本书精华", "e": "60天不是终点是起点。你有60个判断模型，每把都是新工具。接下来不是学更多模型，是用已有模型解决更多问题。每天5分钟回顾一个模型用新场景测试。", "u": "行动建议：每天5分钟回顾一个模型。每周写模型应用日记。每月做模型交叉——两个不相关模型组合解决真实问题。每季度全面复盘用贝叶斯更新。双机系统帮你在Pro设cron推送。", "x": "写下我最常用的5个模型是________，我今天就能用到的一个场景是________。", "p": "从今天开始你成为了自己的老师。加油，李飞"}}
</script>

let curPhase=0,curDay=0;

function render(){
renderPhases();renderGrid();showDay(Object.keys(DAYS).sort((a,b)=>a-b)[0]);
}
function renderPhases(){
const el=document.getElementById('phases');
el.innerHTML=PHASES.map((p,i)=>'<button class="phase-btn'+(i===curPhase?' active':'')+'" style="--pc:'+COLORS['p'+(i+1)]+'" onclick="switchPhase('+i+')">'+p.title+' <small>'+p.label+'</small></button>').join('');
}
function renderGrid(){
const set=new Set(PHASES[curPhase].days);
const el=document.getElementById('grid');
const sorted=Object.keys(DAYS).map(Number).sort((a,b)=>a-b);
el.innerHTML=sorted.map(d=>set.has(d)?'<div class="day-sq" style="--pc:'+COLORS['p'+(curPhase+1)]+'" data-d="'+d+'" onclick="showDay('+d+')"><span class="dn">'+d+'</span><span class="dt">'+DAYS[d].t+'</span></div>':'').join('');
}
function switchPhase(i){curPhase=i;renderGrid();const set=PHASES[i].days;showDay(set[0]);}
function showDay(d){
if(!DAYS[d])return;
curDay=d;
document.querySelectorAll('.day-sq').forEach(s=>s.style.borderColor=s.dataset.d==d?'var(--pc,#a855f7)':'');
const dd=DAYS[d];
document.getElementById('content').innerHTML=
'<div class="day-card show" style="--pc:'+COLORS['p'+(PHASES.findIndex(p=>p.days.includes(d))+1)]+'">'+
'<div class="dc-header"><h2>Day '+d+'：'+dd.t+'</h2><span class="tag">'+dd.c.substring(0,20)+'...</span></div>'+
'<div class="dc-sec"><div class="sl">核心概念</div><div class="sv hl">'+dd.c+'</div></div>'+
'<div class="dc-sec"><div class="sl">来自</div><div class="sv">'+dd.b+'</div></div>'+
'<div class="dc-sec"><div class="sl">关键解释</div><div class="sv">'+dd.e+'</div></div>'+
'<div class="dc-sec"><div class="sl">与你相关</div><div class="sv">'+dd.u+'</div></div>'+
'<div class="dc-sec"><div class="sl">今日练习</div><div class="sv">'+dd.x+'</div></div>'+
'<div class="dc-rb"><div class="sl">明日预告</div><div class="sv">'+dd.p+'</div></div>'+
'<div class="dc-nav"><button onclick="prevDay()">← 前一天</button><button onclick="nextDay()">后一天 →</button></div>'+
'</div>';
}
function prevDay(){
const sorted=Object.keys(DAYS).map(Number).sort((a,b)=>a-b);
const idx=sorted.indexOf(curDay);
if(idx>0)showDay(sorted[idx-1]);
}
function nextDay(){
const sorted=Object.keys(DAYS).map(Number).sort((a,b)=>a-b);
const idx=sorted.indexOf(curDay);
if(idx<sorted.length-1)showDay(sorted[idx+1]);
}
render();
</script>
</body>
</html>
